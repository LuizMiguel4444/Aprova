<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1530" media="(prefers-color-scheme: dark)">
<meta name="description" content="Aprova: planejamento e acompanhamento de estudos para concursos públicos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aprova">
<title>Aprova</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--sf:#fff;--ink:#10204a;--mu:#5a6785;--ln:#dfe4f0;--pr:#1f4fd8;--yl:#f7c600;--ok:#1a9a5b;--bd:#d9453d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1530;--sf:#16204a;--ink:#eef1fb;--mu:#9aa6c8;--ln:#26325f;--pr:#7a9cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1530;--sf:#16204a;--ink:#eef1fb;--mu:#9aa6c8;--ln:#26325f;--pr:#7a9cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:27px;margin:2px 0 12px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h2{font-size:17px;margin:22px 0 8px;font-weight:800}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wr{flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 select,.g2 input{margin-top:0}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--pr);color:var(--bg);border:0;border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.g{background:transparent;color:var(--pr);border:1px solid var(--ln)}
.btn[disabled]{opacity:.4}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;min-height:44px;margin-top:4px}
label{display:block}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;border:0;padding:8px 0;font-size:12px;color:var(--mu);font-weight:600}
nav button.on{color:var(--pr)}nav b{display:block;font-size:20px}
.seg{display:flex;gap:6px}.seg i{flex:1;height:14px;border-radius:7px;background:var(--ln)}
.bar{height:10px;border-radius:5px;background:var(--ln);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tag{font-size:12px;border-radius:99px;padding:2px 8px;background:var(--ln)}
.tbl{display:grid;grid-template-columns:1fr auto auto auto;gap:8px 14px;font-size:14px;align-items:center}
.ov{position:fixed;inset:0;background:rgba(10,20,50,.55);display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--sf);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
#ts{position:fixed;left:12px;right:12px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:8;max-width:536px;margin:auto}
.tst{background:var(--pr);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.tst button{background:none;border:0;color:var(--bg);font-weight:800;text-decoration:underline;min-height:36px}
:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
ol{padding-left:20px;margin:6px 0}li{margin:6px 0}
.scr{overflow-x:auto}.tb{border-collapse:collapse;font-size:13px;width:100%}.tb th,.tb td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ln)}.tb th:first-child,.tb td:first-child{text-align:left}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mu)}.pill.k1{background:var(--yl);border-color:var(--yl);color:#10204a}.pill.k2{background:var(--ok);border-color:var(--ok);color:#fff}
.er{color:var(--bd);font-size:14px;margin-top:8px}
svg text{fill:var(--mu);font-size:9px}
</style></head><body>
<main id="m"></main><div id="ts"></div><div id="sh"></div>
<nav>
<button data-a="tab" data-v="hoje"><b>📅</b>Hoje</button>
<button data-a="tab" data-v="plano"><b>🗺️</b>Plano</button>
<button data-a="tab" data-v="desemp"><b>📈</b>Desempenho</button>
<button data-a="tab" data-v="erros"><b>📝</b>Erros</button>
<button data-a="tab" data-v="metas"><b>⚙️</b>Metas</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=(c,q)=>q?Math.round(100*c/q):0;
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const hm=m=>Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addD=n=>{const x=new Date();x.setDate(x.getDate()+n);return ymd(x)};
const fd=d=>d.split("-").reverse().slice(0,2).join("/");
const uid=()=>Math.random().toString(36).slice(2,9);
let T=ymd(new Date()),tab="hoje",sh=null,snap=null,tmo=null,armed=false,tt=0,F={st:"pend",s:"",ty:"",q:"",o:"new"};
const CFG={min:120,th:20,qm:20,em:5,qg:150,ag:75,exam:"",cut:0,pt:0,dias:[1,2,3,4,5,6]};
// Modelo pronto: BB Agente Comercial (edital 2022, Cesgranrio). [id, nome, cor, blocos por ciclo, questões, pontos, tópicos]
const TPL={bb:[
["port","Língua Portuguesa","#2f6fed",3,10,15,"Interpretação de texto|Ortografia e acentuação|Classes de palavras|Concordância|Regência e crase|Pontuação|Reescrita de frases"],
["mat","Matemática","#e0823a",3,5,7.5,"Operações e frações|Razão e proporção|Regra de três|Porcentagem|Equações e sistemas|Medidas e contagem|Gráficos e tabelas"],
["mf","Matemática Financeira","#c9486b",2,5,7.5,"Juros simples|Juros compostos|Taxas equivalentes|Descontos|Séries de pagamentos|SAC e Price"],
["ban","Conhecimentos Bancários","#1a9a5b",3,10,15,"Sistema Financeiro Nacional|Produtos e serviços bancários|Meios de pagamento e Pix|Renda fixa e mercado de capitais|Câmbio|Lavagem de dinheiro e compliance|LGPD e ética|Seguros e previdência"],
["atu","Atualidades do Mercado Financeiro","#8a5cd6",1,5,5,"Economia, Selic e inflação|Open Finance e Pix|Fintechs e inovação|Sustentabilidade e ESG|Notícias do BB"],
["inf","Informática","#1fa3b8",3,15,22.5,"Hardware e sistemas operacionais|Word|Excel|Internet e navegadores|E-mail e colaboração|Segurança da informação|Redes e nuvem"],
["ven","Vendas e Negociação","#c79a00",3,15,22.5,"Marketing e CRM|Etapas da venda consultiva|Negociação|Atendimento e comunicação|Comportamento do cliente|Pós-venda e fidelização|Ética em vendas"],
["ing","Inglês","#6b7a99",1,5,5,"Interpretação de textos|Vocabulário e cognatos|Tempos verbais|Conectivos e pronomes"],
["red","Redação","#8a6a4a",1,0,0,"Texto dissertativo-argumentativo"]]};
const mk=(n,tp)=>({n,cfg:{...CFG},subs:(TPL[tp]||[]).map(a=>({id:a[0],n:a[1],c:a[2],w:a[3],q:a[4],p:a[5],t:a[6].split("|")})),ci:0,day:null,log:[],rev:[],err:[],pr:{},sim:[]});
let S;try{S=JSON.parse(localStorage.getItem("rotaestudos"))}catch(e){}
if(!S){let o=null;try{o=JSON.parse(localStorage.getItem("rotabb"))}catch(e){}
 const b=mk("BB — Agente Comercial","bb");if(o)Object.assign(b,o,{cfg:{...CFG,...o.cfg}});
 S={v:2,cur:"p1",profiles:{p1:b}}}
function norm(){Object.values(S.profiles).forEach(p=>{const z=mk(p.n||"Concurso");Object.keys(z).forEach(k=>{if(p[k]==null)p[k]=z[k]});p.cfg={...CFG,...p.cfg};if(!Array.isArray(p.cfg.dias))p.cfg.dias=CFG.dias;p.subs.forEach(s=>{s.id=s.id||uid();s.t=Array.isArray(s.t)?s.t:[];s.w=+s.w||0;s.q=+s.q||0;s.p=+s.p||0;s.c=s.c||"#2f6fed";s.n=s.n||"Disciplina"});["log","rev","err","sim"].forEach(k=>p[k].forEach(x=>{x.id=x.id||uid()}));p.err.forEach(e=>{e.st=e.st||"pend"})})}
norm();
const P=()=>S.profiles[S.cur];
const save=()=>{try{localStorage.setItem("rotaestudos",JSON.stringify(S));return 1}catch(e){toast("Sem espaço para salvar. Exclua fotos antigas ou exporte um backup.");return 0}};
const sb=(p,id)=>p.subs.find(x=>x.id===id)||{n:"(disciplina removida)",c:"#8a93a8",t:[],w:0};
const cyc=p=>p.subs.flatMap(s=>Array.from({length:s.w},(_,i)=>({id:s.id,k:(i+.5)/s.w}))).sort((a,b)=>a.k-b.k||a.id.localeCompare(b.id)).map(x=>x.id);
const BM=p=>Math.max(10,p.cfg.th+p.cfg.qm+p.cfg.em);
const PH=p=>[["Teoria",p.cfg.th],["Questões",p.cfg.qm],["Caderno de erros",p.cfg.em]].filter(x=>x[1]>0);
const nb=p=>Math.max(1,Math.floor(p.cfg.min/BM(p)));
const daysTo=p=>p.cfg.exam?Math.ceil((new Date(p.cfg.exam)-new Date(T))/864e5):null;
function streak(p){const ds=new Set(p.log.map(x=>x.d));let n=0,i=ds.has(T)?0:-1;while(ds.has(addD(i))){n++;i--}return n}
function toast(m,u){clearTimeout(tt);$("#ts").innerHTML=`<div class="tst"><span>${m}</span>${u&&snap?`<button data-a="undo">Desfazer</button>`:""}</div>`;tt=setTimeout(()=>{$("#ts").innerHTML=""},8000)}
function mut(f,m){snap=JSON.stringify(S);f();save();render();toast(m,1)}
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
let ip=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;render()});
addEventListener("appinstalled",()=>{ip=null;render();toast("App instalado.")});
function inst(){if(standalone())return"";return `<div class="card" style="border-left:6px solid var(--yl)"><b>Instalar no celular</b><div class="mu">${ip?"Instale para abrir como um app, em tela cheia e funcionando sem internet.":ios?"No iPhone, abra no Safari, toque em Compartilhar e depois em Adicionar à Tela de Início.":"No navegador do celular, abra o menu e escolha Instalar app ou Adicionar à tela inicial."}</div>${ip?`<button class="btn" data-a="inst" style="margin-top:10px">Instalar app</button>`:""}</div>`}

const nf=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});
const fdl=d=>d.split("-").reverse().join("/");
const mss=s=>{s=Math.round(s);return Math.floor(s/60)+"m"+String(s%60).padStart(2,"0")+"s"};
const wd=s=>{const[y,m,d]=s.split("-");return new Date(y,m-1,d).getDay()};
const dayN=(p,s)=>p.cfg.dias.includes(wd(s))?nb(p):0;
const pw=s=>s.p||s.q||0;
const iv=id=>{const v=$("#"+id).value.trim();return v===""?NaN:Number(v)};
const bad=m=>{$("#er").textContent=m};
const del=(a,i,m,lb)=>`data-a="ask" data-do="${a}" data-i="${i}" data-msg="${E(m)}"${lb?` data-lb="${lb}"`:""}`;

function hoje(){
 const p=P(),cy=cyc(p),n=dayN(p,T),done=p.ci-p.day.ci0,dt=daysTo(p),tm0=sum(p.log.filter(x=>x.d===T),x=>x.m),st=streak(p),bm=BM(p);
 let seg="",cards="";
 if(!cy.length)cards=`<div class="card">Este concurso ainda não tem disciplinas no ciclo. Adicione disciplinas em Metas e defina os blocos por ciclo.</div>`;
 else for(let k=0;k<Math.max(n,done+1);k++){
  const id=cy[(p.day.ci0+k)%cy.length],o=sb(p,id),ti=p.pr[id]||0,tp=(o.t[Math.min(ti,o.t.length-1)]||o.n)+(o.t.length&&ti>=o.t.length?" (revisão geral)":"");
  seg+=`<i style="${k<done?"background:"+o.c:""}"></i>`;
  cards+=`<div class="card" style="border-left:6px solid ${o.c};${k<done?"opacity:.55":""}"><div class="row sp"><b>${E(o.n)}</b><span class="tag">${k<done?"feito":(k==done&&done>=n)?"bônus":bm+" min"}</span></div><div>${E(tp)}</div><div class="mu">${p.cfg.th} min de teoria, ${p.cfg.qm} de questões e ${p.cfg.em} no caderno de erros.</div>${k==done?`<div class="row" style="margin-top:10px"><button class="btn" data-a="tstart" data-k="${k}" data-s="${id}">Iniciar cronômetro</button><button class="btn g" data-a="open" data-k="${k}" data-s="${id}">Já estudei</button></div>`:""}</div>`;
 }
 const due=p.rev.filter(r=>r.due<=T);
 const rv=due.length?due.slice(0,6).map(r=>`<div class="card row sp"><div><b>${E(r.p)}</b><div class="mu">${E(sb(p,r.s).n)} · ${r.n}ª revisão</div></div><div class="row"><button class="btn g" data-a="rv" data-i="${r.id}">Feito</button><button class="btn g" ${del("rdel",r.id,"Excluir esta revisão agendada?")} aria-label="Excluir revisão">✕</button></div></div>`).join(""):`<p class="mu">Nenhuma revisão pendente. Elas aparecem 1, 7 e 30 dias depois de você terminar um tópico.</p>`;
 return `<div class="mu">${E(p.n)} · ${new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"})}</div>
<h1>${n==0&&done==0?"Dia de descanso":done>=n?"Meta do dia batida":"Faltam "+(n-done)+(n-done>1?" blocos":" bloco")+" hoje"}</h1>
<div class="seg">${seg}</div>
<div class="mu" style="margin-top:8px">${hm(tm0)} estudadas hoje · meta de ${n} ${n==1?"bloco":"blocos"} (${n*bm} min) · sequência de ${st} ${st==1?"dia":"dias"}${dt!=null&&dt>=0?" · prova em "+dt+" dias":""}</div>
${ip?inst():""}
<h2>Revisões de hoje (${due.length})</h2>${rv}
<h2>${n==0&&done==0?"Bloco bônus (opcional)":"Blocos de hoje"}</h2>${cards}`;
}

function plano(){
 const p=P(),first=p.log.length?p.log[0].d:T,age=Math.floor((new Date(T)-new Date(first))/864e5),dt=daysTo(p),tw=sum(p.subs,s=>s.w);
 const ph=(dt!=null&&dt>=0&&dt<=60)||age>=180?3:age>=90?2:1;
 const F3=[["Fase 1: Base","Percorra o ciclo completo com teoria curta e questões simples, criando o hábito e cobrindo todo o conteúdo."],["Fase 2: Questões","A maior parte do tempo em questões no estilo da banca, simulado a cada 2 semanas e revisão do caderno de erros."],["Fase 3: Reta final","Com a data da prova definida, simulados completos e cronometrados toda semana e revisão do que você mais erra."]];
 const rows=p.subs.map(s=>`<span class="row"><i class="dot" style="background:${s.c}"></i>${E(s.n)}</span><span>${s.q||"—"}</span><span>${s.p||"—"}</span><span>${s.w}/${tw}</span>`).join("");
 return `<h1>Plano de ${E(p.n)}</h1>
<div class="card"><b>Método</b><ol><li>Teoria curta, só o que você precisa para resolver questões.</li><li>Questões logo em seguida, que é onde se aprende de verdade.</li><li>Caderno de erros, anotando o motivo de cada erro.</li><li>Revisões em 1, 7 e 30 dias, agendadas pelo app.</li><li>Simulado cronometrado a cada 2 semanas.</li></ol></div>
<h2>Fases</h2>${F3.map((f,i)=>`<div class="card" style="${i+1==ph?"border:2px solid var(--pr)":""}"><b>${f[0]}</b>${i+1==ph?` <span class="tag">você está aqui</span>`:""}<div class="mu">${f[1]}</div></div>`).join("")}
<h2>Divisão do tempo</h2>
<div class="card">${p.subs.length?`<div class="tbl"><b>Disciplina</b><b>Questões</b><b>Pontos</b><b>Blocos</b>${rows}</div>`:`<span class="mu">Nenhuma disciplina cadastrada.</span>`}</div>
<p class="mu">Cada ciclo reúne ${tw} blocos. Mude a divisão, as disciplinas e os tópicos em Metas. O modelo de BB usa a estrutura do edital de 2022 (Cesgranrio); confira o edital novo quando sair.</p>`;
}

let dtab="res",G={ev:"g",rg:30},pend=null;
const TY={nao:"Não sabia o conteúdo",at:"Falta de atenção",pg:"Pegadinha",ca:"Erro de cálculo",tp:"Falta de tempo"};
const TYA={nao:"Volte à teoria desses tópicos e refaça questões do assunto.",at:"Leia o comando e as negações do enunciado com calma antes de marcar.",pg:"Estude as pegadinhas mais comuns da banca e releia todas as alternativas.",ca:"Treine contas e confira o resultado antes de marcar.",tp:"Treine com cronômetro e deixe as questões longas para o fim."};
const DW=["D","S","T","Q","Q","S","S"];
const colr=(p,a)=>a>=p.cfg.ag?"var(--ok)":a>=p.cfg.ag-15?"var(--yl)":"var(--bd)";
const accW=(p,f,t,sid)=>{const l=p.log.filter(x=>x.d>=f&&x.d<=t&&(!sid||x.s==sid)),q=sum(l,x=>x.q);return q?{a:100*sum(l,x=>x.c)/q,q}:null};
const tb=(h,r)=>`<div class="scr"><table class="tb"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.map(a=>`<tr>${a.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const bars=(rows)=>rows.map(r=>`<div style="margin:10px 0"><div class="row sp"><span>${r[0]}</span><span class="mu">${r[1]}</span></div><div class="bar"><i style="width:${Math.min(100,r[2])}%;background:${r[3]}"></i></div></div>`).join("");

function lc(ser,lab,ref,al){
 const w0=320,h=150,l=26,r=8,t=8,b=20,n=lab.length,x=i=>l+(n<2?(w0-l-r)/2:i*(w0-l-r)/(n-1)),y=v=>t+(100-v)*(h-t-b)/100;
 let g=[0,50,100].map(v=>`<line x1="${l}" x2="${w0-r}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--ln)"/><text x="${l-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`).join("");
 if(ref)g+=`<line x1="${l}" x2="${w0-r}" y1="${y(ref)}" y2="${y(ref)}" stroke-dasharray="4 3" style="stroke:var(--bd)"/>`;
 g+=ser.map(s=>{let d="",pen=0,dots="";s.v.forEach((v,i)=>{if(v==null){pen=0;return}d+=(pen?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1);pen=1;if(n<=14)dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" style="fill:${s.c}"/>`});return `<path d="${d}" fill="none" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" style="stroke:${s.c}"/>${dots}`}).join("");
 g+=[...new Set([0,Math.floor((n-1)/2),n-1])].map(i=>`<text x="${x(i)}" y="${h-5}" text-anchor="${i==0?"start":i==n-1?"end":"middle"}">${fd(lab[i])}</text>`).join("");
 return `<svg viewBox="0 0 ${w0} ${h}" width="100%" role="img" aria-label="${al}">${g}</svg>`;
}
// nota projetada: acerto dos últimos 30 dias x pontos de cada disciplina
function pj(p){const f=addD(-29),rows=p.subs.filter(s=>pw(s)>0).map(s=>({s,a:accW(p,f,T,s.id)})),cov=rows.filter(r=>r.a),Tp=sum(rows,r=>pw(r.s)),C=sum(cov,r=>pw(r.s)),sc=sum(cov,r=>pw(r.s)*r.a.a/100);return{cov,Tp,C,est:C?100*sc/C:0,k:Tp?100/Tp:0}}
// cumprimento da meta: dia cumprido = todos os blocos planejados feitos
function mst(p){
 const ds=[...new Set(p.log.map(x=>x.d))].sort(),first=ds[0]||T,bd={};p.log.forEach(e=>{if(e.b)bd[e.d]=(bd[e.d]||0)+1});
 const dr=d=>{if(d<first||d>T)return null;const n=dayN(p,d);if(!n)return null;const k=Math.min(bd[d]||0,n);return d==T&&k<n?null:{n,k}};
 let d1=0,d2=0,w1=0,w2=0,best=0,run=0,pv=0;

<p class="mu">Com ${c.min} min por dia e blocos de ${bm} min, o app planeja ${nbk} ${nbk==1?"bloco":"blocos"} por dia de estudo${rest>=10?`, e sobram ${rest} min para revisões`:""}. Fora dos dias de estudo, há um bloco bônus opcional.</p></div>
<h2>Disciplinas</h2>${sl}<button class="btn" data-a="sopen" data-i="">Adicionar disciplina</button>
${inst()}<h2>Backup</h2><div class="card"><div class="row wr"><button class="btn" data-a="exp">Exportar arquivo</button><button class="btn g" data-a="cpy">Copiar dados</button></div>
<label class="mu" style="margin-top:12px">Importar arquivo<input id="fi" type="file" accept=".json,application/json"></label>
<label class="mu" style="margin-top:8px">Ou cole os dados aqui<textarea id="bk" rows="3"></textarea></label>
<button class="btn g" data-a="impt" style="margin-top:8px">Importar texto</button>
<p class="mu">Dados salvos neste aparelho: cerca de ${kb} KB (limite do navegador: cerca de 5.000 KB). Fotos ocupam a maior parte.</p></div>
<button class="btn g" ${del("reset","","Apagar TODOS os dados do app, de todos os concursos?")} style="margin-top:14px;color:var(--bd)">Apagar todos os dados</button>`;
}

const W=(h,b,a)=>`<div class="ov"><div class="sheet"><h2 style="margin-top:0">${h}</h2>${b}<div class="er" id="er" role="alert"></div><div class="row" style="margin-top:12px"><button class="btn g" data-a="close" style="flex:1">Cancelar</button><button class="btn" data-a="${a}" style="flex:1">Salvar</button></div></div></div>`;
const L=(t,i)=>`<label class="mu" style="margin-top:8px">${t}${i}</label>`;
const N=(id,v)=>`<input id="${id}" type="number" inputmode="numeric" min="0" step="1" value="${v}">`;
const pv=()=>sh.img?`<img src="${sh.img}" alt="Foto da questão" style="max-width:100%;max-height:200px;border-radius:8px;margin-top:8px"><div><button class="btn g" data-a="irm" style="margin-top:6px">Remover foto</button></div>`:"";
function SH(){
 const p=P();
 if(sh.t=="cf")return `<div class="ov"><div class="sheet"><h2 style="margin-top:0">Tem certeza?</h2><p>${sh.msg}</p><div class="row"><button class="btn g" data-a="close" style="flex:1">Cancelar</button><button class="btn" data-a="cfy" style="flex:1;background:var(--bd);color:#fff">${sh.lb||"Excluir"}</button></div></div></div>`;
 if(sh.t=="img")return `<div class="ov" data-a="close" style="align-items:center;justify-content:center;background:rgba(0,0,0,.88)"><img src="${sh.src}" alt="Foto da questão" style="max-width:100%;max-height:100%"></div>`;
 if(sh.t=="blk")return W(E(sb(p,sh.s).n),L("Tempo total do bloco (min)",N("fm",sh.m))+`<div class="g2">${L("Questões feitas",N("fq",10))}${L("Acertos",N("fc",0))}</div>`+L("Tempo gasto nas questões (min)",N("fqm",sh.qm))+`<label class="row mu" style="margin-top:12px"><input id="ft" type="checkbox" checked style="width:auto;min-height:0;margin:0"> Terminei este tópico (agenda revisões em 1, 7 e 30 dias)</label>`,"done");
 if(sh.t=="err"){const e=p.err.find(x=>x.id==sh.id)||{s:p.subs[0]?.id,t:"",st:"pend",ty:""};
  return W(sh.id?"Editar erro":"Novo erro",L("Disciplina",`<select id="es">${p.subs.map(s=>`<option value="${s.id}" ${s.id==e.s?"selected":""}>${E(s.n)}</option>`).join("")}</select>`)+L("Tipo de erro",`<select id="ety"><option value="">Sem tipo</option>${Object.entries(TY).map(([k,v])=>`<option value="${k}" ${k==e.ty?"selected":""}>${v}</option>`).join("")}</select>`)+L("O que errei e por quê",`<textarea id="et" rows="4" maxlength="2000">${E(e.t)}</textarea>`)+L("Foto da questão (opcional)",`<input id="ef" type="file" accept="image/*">`)+`<div id="ep">${pv()}</div>`+L("Situação",`<select id="eu"><option value="pend" ${e.st=="pend"?"selected":""}>Pendente</option><option value="ok" ${e.st=="ok"?"selected":""}>Dominado</option></select>`),"esave")}
 if(sh.t=="sub"){const s=p.subs.find(x=>x.id==sh.id)||{n:"",c:"#2f6fed",w:1,q:0,p:0,t:[]};
  return W(sh.id?"Editar disciplina":"Nova disciplina",L("Nome",`<input id="sn" maxlength="60" value="${E(s.n)}">`)+`<div class="g2">${L("Cor",`<input id="sc" type="color" value="${s.c}">`)}${L("Blocos por ciclo (0 a 20)",N("sw",s.w))}${L("Questões na prova",N("sq",s.q))}${L("Pontos na prova",`<input id="sp" type="number" inputmode="decimal" min="0" step="0.5" value="${s.p}">`)}</div>`+L("Tópicos (um por linha)",`<textarea id="st" rows="6">${E(s.t.join("\n"))}</textarea>`),"ssave")}
 if(sh.t=="sim"){const ls=p.subs.filter(s=>s.q>0).length?p.subs.filter(s=>s.q>0):p.subs;
  return W("Registrar simulado",L("Nome ou fonte (opcional)",`<input id="xn" maxlength="60" placeholder="Ex.: Simulado 3">`)+`<div class="g2">${L("Data",`<input id="xd" type="date" value="${T}" max="${T}">`)}${L("Tempo gasto (min)",N("xm",""))}</div>`+L("Questões em branco (opcional)",N("xb",""))+`<div class="mu" style="margin-top:12px">Acertos por disciplina (deixe em branco o que não fez)</div>`+ls.map(s=>`<div class="row" style="margin-top:6px"><span style="flex:2" class="mu"><i class="dot" style="background:${s.c}"></i> ${E(s.n)}</span><input id="xa_${s.id}" type="number" inputmode="numeric" min="0" placeholder="acertos" style="flex:1;margin:0"><span class="mu">de</span><input id="xt_${s.id}" type="number" inputmode="numeric" min="0" value="${s.q}" style="flex:1;margin:0"></div>`).join("")+L("Observações (opcional)",`<textarea id="xo" rows="3" maxlength="500" placeholder="O que deu errado, o que revisar…"></textarea>`),"xsave")}
 return W("Novo concurso",L("Nome",`<input id="cn" maxlength="60" placeholder="Ex.: INSS, Receita Federal">`)+L("Começar com",`<select id="ct"><option value="">Em branco</option><option value="bb">Modelo BB — Agente Comercial</option></select>`),"csave");
}
function TS(){
 const p=P(),ph=PH(p),c=ph[tmo.i]||["Etapa",0];
 if(tmo.cf)return `<div class="ov"><div class="sheet"><h2 style="margin-top:0">Descartar o cronômetro?</h2><p>O tempo registrado até agora (${fmt(tmo.el)}) será perdido.</p><div class="row"><button class="btn g" data-a="tback" style="flex:1">Voltar</button><button class="btn" data-a="tdrop" style="flex:1;background:var(--bd);color:#fff">Descartar</button></div></div></div>`;
 return `<div class="ov"><div class="sheet" style="text-align:center"><div class="mu">${E(sb(p,tmo.s).n)} · etapa ${tmo.i+1} de ${ph.length}</div><h2 style="margin:4px 0">${c[0]}</h2>
<div id="tc" style="font-size:64px;font-weight:800;font-variant-numeric:tabular-nums" role="timer">${fmt(tmo.left)}</div>
<div class="mu">${tmo.left<=0?"Etapa concluída":tmo.run?"Em andamento":"Pausado"} · total <span id="te">${fmt(tmo.el)}</span></div>
<div class="row" style="margin:14px 0 8px"><button class="btn g" data-a="tpause" style="flex:1" ${tmo.left<=0?"disabled":""}>${tmo.run?"Pausar":"Retomar"}</button><button class="btn" data-a="tnext" style="flex:1">${tmo.i<ph.length-1?"Próxima etapa":"Finalizar"}</button></div>
<div class="row"><button class="btn g" data-a="tcancel" style="flex:1">Cancelar</button><button class="btn g" data-a="tfin" style="flex:1">Encerrar e salvar</button></div></div></div>`;
}
setInterval(()=>{if(!tmo)return;const was=tmo.run;if(was){const n=Date.now(),d=n-tmo.last,ph=PH(P())[tmo.i];tmo.last=n;tmo.el+=d;tmo.left-=d;if(ph)tmo.pe[ph[0]]=(tmo.pe[ph[0]]||0)+d;if(tmo.left<=0){tmo.left=0;tmo.run=false;try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}}
 if(was&&!tmo.run)return render();const a=$("#tc"),b=$("#te");if(a)a.textContent=fmt(tmo.left);if(b)b.textContent=fmt(tmo.el)},1000);

const V={hoje,plano,desemp,erros,metas};
function render(){
 T=ymd(new Date());const p=P();if(!p.day||p.day.d!==T)p.day={d:T,ci0:p.ci};
 $("#m").innerHTML=V[tab]();$("#sh").innerHTML=tmo?TS():sh?SH():"";
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==tab));
}
const val=id=>$("#"+id).value;
const CR={min:[15,720],th:[0,240],qm:[0,240],em:[0,240],qg:[0,2000],ag:[0,100],cut:[0,100],pt:[0,720]};
function pic(f){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.6))};im.src=r.result};r.readAsDataURL(f)})}
function imp(txt){try{const d=JSON.parse(txt);if(!d||typeof d!=="object"||!d.profiles||!d.profiles[d.cur]||!Object.values(d.profiles).every(x=>x&&typeof x==="object"))throw 0;pend=d;sh={t:"cf",do:"impgo",i:"",msg:"Importar vai substituir todos os dados atuais do app. Você poderá desfazer logo em seguida.",lb:"Importar"};render()}catch(e){toast("Arquivo inválido ou corrompido.")}}
const act={
 tab(d){tab=d.v;sh=null;render();scrollTo(0,0)},
 dt(d){dtab=d.v;render()},
 open(d){sh={t:"blk",k:+d.k,s:d.s,m:BM(P()),qm:P().cfg.qm};render()},
 close(){sh=null;render()},
 ask(d){sh={t:"cf",do:d.do,i:d.i,msg:d.msg,lb:d.lb};render()},
 cfy(){const a=sh;sh=null;act[a.do]({i:a.i})},
 undo(){if(!snap)return;S=JSON.parse(snap);snap=null;save();$("#ts").innerHTML="";render()},
 async inst(){if(!ip)return;ip.prompt();try{await ip.userChoice}catch(e){}ip=null;render()},
 tstart(d){const p=P(),ph=PH(p);if(!ph.length)return act.open(d);tmo={k:+d.k,s:d.s,i:0,left:ph[0][1]*6e4,el:0,pe:{},run:true,last:Date.now()};render()},
 tpause(){tmo.run=!tmo.run;tmo.last=Date.now();render()},
 tnext(){const ph=PH(P());if(tmo.i>=ph.length-1)return act.tfin();tmo.i++;tmo.left=ph[tmo.i][1]*6e4;tmo.run=true;tmo.last=Date.now();render()},
 tfin(){const m=Math.max(1,Math.round(tmo.el/6e4));sh={t:"blk",k:tmo.k,s:tmo.s,m,qm:Math.min(m,Math.round((tmo.pe["Questões"]||0)/6e4))};tmo=null;render()},
 tcancel(){tmo.cf=1;render()},tback(){tmo.cf=0;render()},tdrop(){tmo=null;render()},
 done(){
  const p=P(),o=sb(p,sh.s),m=iv("fm"),q=iv("fq"),c=iv("fc"),qm=iv("fqm"),ti=p.pr[sh.s]||0;
  if(!(Number.isInteger(m)&&m>=1&&m<=600))return bad("Informe o tempo total em minutos, de 1 a 600.");
  if(!(Number.isInteger(q)&&q>=0&&q<=500))return bad("Informe as questões feitas, de 0 a 500.");
  if(!(Number.isInteger(c)&&c>=0))return bad("Informe os acertos (0 ou mais).");
  if(c>q)return bad("Os acertos não podem ser maiores que as questões feitas.");
  if(!(Number.isInteger(qm)&&qm>=0))return bad("Informe o tempo nas questões em minutos (0 ou mais).");
  if(qm>m)return bad("O tempo nas questões não pode passar do tempo total do bloco.");
  const tp=o.t[Math.min(ti,o.t.length-1)]||o.n,e={id:uid(),d:T,s:sh.s,m,qm:q?qm:0,q,c,b:1,ti,tp,rid:[]};
  if($("#ft").checked){e.adv=1;[1,7,30].forEach((n,j)=>{const r={id:uid(),s:sh.s,p:tp,n:j+1,due:addD(n)};p.rev.push(r);e.rid.push(r.id)});p.pr[sh.s]=ti+1}
  p.log.push(e);p.ci++;sh=null;save();render()},
 rv(d){const p=P(),i=p.rev.findIndex(r=>r.id==d.i),r=p.rev[i];if(!r)return;p.rev.splice(i,1);p.log.push({id:uid(),d:T,s:r.s,m:10,q:0,c:0,rv:1,tp:r.p,rr:r});save();render()},
 rdel(d){mut(()=>{const p=P();p.rev=p.rev.filter(r=>r.id!=d.i)},"Revisão excluída.")},
 hdel(d){mut(()=>{const p=P(),i=p.log.findIndex(x=>x.id==d.i),e=p.log[i];if(!e)return;p.log.splice(i,1);if(e.rid)p.rev=p.rev.filter(r=>!e.rid.includes(r.id));if(e.rr)p.rev.push(e.rr);if(e.adv)p.pr[e.s]=Math.max(0,(p.pr[e.s]||1)-1);if(e.b&&e.d===T)p.ci=Math.max(p.day.ci0,p.ci-1)},"Registro excluído.")},
 xopen(){sh={t:"sim"};render()},
 xsave(){
  const p=P(),d=val("xd"),m=val("xm")===""?null:iv("xm"),br=val("xb")===""?null:iv("xb"),r={};let tt=0;
  if(!d||d>T)return bad("Informe uma data válida, que não seja futura.");
  if(m!==null&&!(Number.isInteger(m)&&m>=1&&m<=720))return bad("Tempo gasto: informe minutos de 1 a 720.");
  for(const s of p.subs){const ae=$("#xa_"+s.id);if(!ae||ae.value.trim()==="")continue;const a=Number(ae.value),t=iv("xt_"+s.id);
   if(!(Number.isInteger(a)&&a>=0&&Number.isInteger(t)&&t>=1&&t<=500))return bad(s.n+": informe acertos e total com números inteiros (total de 1 a 500).");
   if(a>t)return bad(s.n+": os acertos não podem passar do total de questões.");r[s.id]=[a,t];tt+=t}
  if(!tt)return bad("Preencha os acertos de pelo menos uma disciplina.");
  if(br!==null&&!(Number.isInteger(br)&&br>=0&&br<=tt))return bad("As questões em branco não podem passar do total de questões.");
  p.sim.push({id:uid(),d,nm:val("xn").trim(),tm:m,br,ob:val("xo").trim(),r});sh=null;save();render()},
 sdel(d){mut(()=>{const p=P();p.sim=p.sim.filter(x=>x.id!=d.i)},"Simulado excluído.")},
 eopen(d){const e=P().err.find(x=>x.id==d.i);sh={t:"err",id:d.i,img:e?e.img||"":""};render()},
 esave(){const p=P(),t=val("et").trim();if(!val("es"))return bad("Cadastre uma disciplina antes de anotar erros.");if(!t&&!sh.img)return bad("Descreva o erro ou adicione uma foto.");
  const o={s:val("es"),t,ty:val("ety"),st:val("eu"),img:sh.img||""},e=p.err.find(x=>x.id==sh.id);if(e)Object.assign(e,o);else p.err.unshift({id:uid(),d:T,...o});sh=null;save();render()},
 etog(d){const e=P().err.find(x=>x.id==d.i);if(e){e.st=e.st=="ok"?"pend":"ok";save();render()}},
 edel(d){mut(()=>{const p=P();p.err=p.err.filter(x=>x.id!=d.i)},"Erro excluído.")},
 irm(){sh.img="";$("#ep").innerHTML=""},
 imgv(d){const e=P().err.find(x=>x.id==d.i);if(e&&e.img){sh={t:"img",src:e.img};render()}},
 sopen(d){sh={t:"sub",id:d.i};render()},
 ssave(){const p=P(),n=val("sn").trim(),w=iv("sw"),q=iv("sq"),pt=iv("sp");
  if(!n)return bad("Dê um nome à disciplina.");
  if(p.subs.some(s=>s.id!=sh.id&&s.n.toLowerCase()==n.toLowerCase()))return bad("Já existe uma disciplina com esse nome.");
  if(!(Number.isInteger(w)&&w>=0&&w<=20))return bad("Blocos por ciclo: use um número inteiro de 0 a 20.");
  if(!(Number.isInteger(q)&&q>=0&&q<=500))return bad("Questões na prova: use um número inteiro de 0 a 500.");
  if(!(Number.isFinite(pt)&&pt>=0&&pt<=1000))return bad("Pontos na prova: use um número de 0 a 1000.");
  const o={n,c:val("sc"),w,q,p:pt,t:val("st").split("\n").map(x=>x.trim()).filter(Boolean)},s=p.subs.find(x=>x.id==sh.id);if(s)Object.assign(s,o);else p.subs.push({id:uid(),...o});sh=null;save();render()},
 sdelsub(d){mut(()=>{const p=P();p.subs=p.subs.filter(x=>x.id!=d.i)},"Disciplina excluída.")},
 dia(d){const c=P().cfg,i=+d.i;if(c.dias.includes(i)&&c.dias.length==1)return toast("Mantenha pelo menos um dia de estudo.");c.dias=c.dias.includes(i)?c.dias.filter(x=>x!=i):[...c.dias,i];save();render()},
 cnew(){sh={t:"conc"};render()},
 csave(){const n=val("cn").trim();if(!n)return bad("Dê um nome ao concurso.");const id="p"+uid();S.profiles[id]=mk(n,val("ct"));S.cur=id;sh=null;save();render()},
 cdel(){if(Object.keys(S.profiles).length<2)return;mut(()=>{delete S.profiles[S.cur];S.cur=Object.keys(S.profiles)[0]},"Concurso excluído.")},
 exp(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="aprova-"+T+".json";a.click()},
 cpy(){const j=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast("Dados copiados.")).catch(()=>{$("#bk").value=j;$("#bk").select();toast("Copie o texto da caixa.")})},
 impt(){imp(val("bk"))},
 impgo(){mut(()=>{S=pend;norm()},"Dados importados.");pend=null},
 reset(){mut(()=>{S={v:2,cur:"p1",profiles:{p1:mk("Meu concurso","")}}},"Todos os dados apagados.")}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled&&act[b.dataset.a])act[b.dataset.a](b.dataset)});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
 if(d.cfg){const k=d.cfg,c=P().cfg;
  if(k=="exam"){if(t.value&&t.value<T)toast("Essa data já passou. Confira a data da prova.");c.exam=t.value}
  else{let v=Math.round(+t.value);if(!Number.isFinite(v))v=c[k];const[lo,hi]=CR[k],cl=Math.min(hi,Math.max(lo,v));if(cl!=v)toast(`Valor ajustado ao limite permitido (${lo} a ${hi}).`);const old=c[k];c[k]=cl;if(["th","qm","em"].includes(k)&&c.th+c.qm+c.em<10){c[k]=old;toast("Um bloco precisa ter pelo menos 10 minutos no total.")}}
  save();render()}
 else if(d.f){F[d.f]=t.value;render()}
 else if(d.g){G[d.g]=d.g=="rg"?+t.value:t.value;render()}
 else if("name" in d){const n=t.value.trim();if(n)P().n=n;else toast("O nome não pode ficar vazio.");save();render()}
 else if("cur" in d){S.cur=t.value;save();render()}
 else if(t.id=="ef"&&t.files[0]){const f=t.files[0];if(!/^image\//.test(f.type))return toast("Escolha um arquivo de imagem.");pic(f).then(u=>{sh.img=u;$("#ep").innerHTML=pv()}).catch(()=>toast("Não foi possível abrir essa imagem."))}
 else if(t.id=="fi"&&t.files[0]){const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(t.files[0])}});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
render();
</script></body></html>
