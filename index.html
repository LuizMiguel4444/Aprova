<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Aprova</title>
<meta name="theme-color" content="#0F1220" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
:root{
  --bg:#0F1220; --surface:#171B2E; --surface2:#1F2440; --surface3:#262C4A;
  --border:#2A2F4D; --ink:#ECE9E1; --ink-dim:#9B98AC; --ink-faint:#6B6880;
  --accent:#E3A72B; --accent-dim:#8A6A24; --accent-ink:#231A05;
  --good:#4FAE7C; --good-bg:rgba(79,174,124,.15);
  --warn:#C1543C; --warn-bg:rgba(193,84,60,.15);
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Roboto Mono",Consolas,Menlo,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
button, input, select{ font-family:inherit; }
#app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px; }
.app-inner{ padding:0 0 24px; }

.screen-header{ display:flex; align-items:center; justify-content:space-between; padding:20px 16px 10px; position:sticky; top:0; background:var(--bg); z-index:5; }
.screen-header h1{ font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:0; }
.header-spacer{ width:32px; height:32px; display:inline-block; }
.icon-btn{ width:32px; height:32px; border-radius:50%; border:none; background:var(--surface2); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-btn svg{ width:18px; height:18px; }

.screen-body{ padding:0 16px; }

.hero-card{ background:linear-gradient(160deg, var(--surface2), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; }
.hero-date{ text-transform:capitalize; color:var(--ink-dim); font-size:13px; margin-bottom:10px; }
.hero-goal-label{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
.hero-goal-value{ margin-top:8px; font-family:var(--mono); font-size:14px; color:var(--ink-dim); }

.alert-card{ background:var(--warn-bg); border:1px solid var(--warn); color:var(--ink); padding:12px 14px; border-radius:var(--radius-sm); margin-bottom:16px; cursor:pointer; font-size:14px; }
.alert-card strong{ color:var(--warn); }

.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:20px 0 10px; font-weight:600; }
.section-title.warn-title{ color:var(--warn); }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }

.priority-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
.priority-rank{ font-family:var(--mono); font-size:13px; color:var(--ink-faint); width:20px; flex-shrink:0; }
.priority-main{ flex:1; min-width:0; }
.priority-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.priority-name{ font-weight:600; font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.priority-score{ font-family:var(--mono); font-size:13px; color:var(--accent); flex-shrink:0; }
.priority-bar-track{ height:5px; background:var(--surface3); border-radius:3px; overflow:hidden; margin-bottom:6px; }
.priority-bar-fill{ height:100%; border-radius:3px; }
.priority-meta{ font-size:11.5px; color:var(--ink-dim); }

.btn{ border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-block{ width:100%; display:block; margin-top:10px; text-align:center; }
.btn-accent{ background:var(--accent); color:var(--accent-ink); }
.btn-outline{ background:transparent; border:1px solid var(--border); color:var(--ink); }
.btn-danger{ background:transparent; border:1px solid var(--warn); color:var(--warn); }
.btn-danger.armed{ background:var(--warn); color:var(--ink); }
.btn-sm{ padding:7px 12px; font-size:12.5px; }

label{ display:block; font-size:12.5px; color:var(--ink-dim); margin:10px 0 5px; }
input[type=text], input[type=number], input[type=date], select{
  width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--ink);
  border-radius:var(--radius-sm); padding:11px 12px; font-size:14px; appearance:none;
}
input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.inline-form{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.inline-form input{ flex:1; }
.unit-label{ font-size:13px; color:var(--ink-dim); white-space:nowrap; }

.color-picker{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 14px; }
.color-opt{ width:30px; height:30px; border-radius:50%; display:inline-flex; cursor:pointer; border:2px solid transparent; position:relative; }
.color-opt input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.color-opt:has(input:checked){ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

.chip{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
.chip-neutral{ background:var(--surface2); color:var(--ink-dim); }
.chip-good{ background:var(--good-bg); color:var(--good); }
.chip-warn{ background:var(--warn-bg); color:var(--warn); }
.pbar{ height:8px; background:var(--surface3); border-radius:4px; overflow:hidden; }
.pbar-fill{ height:100%; border-radius:4px; }
.pbar-accent{ background:var(--accent); }
.pbar-good{ background:var(--good); }
.pbar-neutral{ background:var(--ink-faint); }
.pbar-warn{ background:var(--warn); }

.empty{ text-align:center; padding:32px 16px; color:var(--ink-dim); }
.empty-title{ font-weight:600; color:var(--ink); margin-bottom:6px; }
.empty-msg{ font-size:13.5px; line-height:1.5; }
.empty-msg-sm{ font-size:13px; color:var(--ink-faint); padding:6px 0; }
.muted-text{ font-size:13px; color:var(--ink-dim); line-height:1.5; }

.dot{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

.tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:10; }
.tab-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); padding:6px 2px; cursor:pointer; }
.tab-btn.active{ color:var(--accent); }
.tab-icon svg{ width:22px; height:22px; }
.tab-label{ font-size:10px; font-weight:600; }

.subject-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
.subject-row{ display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; }
.subject-info{ flex:1; min-width:0; }
.subject-name{ font-weight:600; font-size:14.5px; }
.subject-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
.chev{ color:var(--ink-faint); font-size:18px; }
.subject-expanded{ padding:0 14px 14px; border-top:1px solid var(--border); }
.topics-list{ margin:10px 0; }
.topic-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--border); }
.topic-row:last-child{ border-bottom:none; }
.icon-btn-sm{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:4px; }
.row-actions{ display:flex; gap:8px; margin-top:12px; }
.row-actions .btn{ flex:1; }

.timer-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 20px; text-align:center; }
.timer-subject{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--ink-dim); margin-bottom:18px; }
.timer-display{ font-family:var(--mono); font-size:44px; font-weight:600; letter-spacing:.02em; margin-bottom:8px; }
.timer-status{ font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:22px; }
.timer-actions{ display:flex; gap:10px; justify-content:center; }
.timer-actions .btn{ min-width:120px; }

.review-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; }
.review-info{ flex:1; min-width:0; }
.review-name{ font-size:14px; font-weight:600; }
.review-when{ font-size:12px; margin-top:2px; color:var(--ink-dim); }
.review-atrasada{ color:var(--warn); }
.review-hoje{ color:var(--accent); }

.wd-tabs{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px; }
.wd-tabs::-webkit-scrollbar{ display:none; }
.wd-tab{ flex:0 0 auto; padding:8px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-dim); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
.wd-tab.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.wd-tab.rest{ opacity:.6; border-style:dashed; }
.sched-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; }
.sched-info{ flex:1; min-width:0; }
.sched-name{ font-size:14px; font-weight:600; }
.sched-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
.sched-order{ display:flex; flex-direction:column; gap:2px; }
.sched-order button{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11px; padding:2px 5px; line-height:1; }
.sched-order button:disabled{ opacity:.25; cursor:default; }
.sched-day-total{ font-size:12.5px; color:var(--ink-dim); margin:2px 0 12px; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin:0; }
.toggle-row span{ font-size:13.5px; color:var(--ink); }
.toggle-row input{ width:auto; flex-shrink:0; }

.q-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); }
.q-row:last-child{ border-bottom:none; }
.perf-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.perf-name{ font-size:13px; width:96px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.perf-row .pbar{ flex:1; }
.perf-pct{ font-family:var(--mono); font-size:12px; width:38px; text-align:right; flex-shrink:0; }

.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px; }
.stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 8px; text-align:center; }
.stat-value{ font-family:var(--mono); font-size:17px; font-weight:700; color:var(--accent); }
.stat-label{ font-size:10.5px; color:var(--ink-dim); margin-top:4px; }
.dist-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.dist-label{ width:104px; flex-shrink:0; font-size:12.5px; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dist-row .pbar{ flex:1; }
.dist-val{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); width:52px; text-align:right; flex-shrink:0; }
.evo-chart{ display:flex; align-items:flex-end; justify-content:space-between; height:100px; padding-top:10px; }
.evo-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; justify-content:flex-end; height:100%; }
.evo-bar{ width:14px; background:var(--accent); border-radius:4px; }
.evo-label{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; }

.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-month-label{ font-weight:600; text-transform:capitalize; }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-faint); margin-bottom:4px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:14px; }
.cal-cell{ aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:var(--surface); border:1px solid transparent; }
.cal-cell.empty{ background:none; cursor:default; }
.cal-cell.today{ border-color:var(--accent); }
.cal-cell.selected{ background:var(--surface3); }
.cal-day-num{ font-size:12.5px; }
.cal-dots{ display:flex; gap:2px; height:6px; margin-top:2px; }
.cal-dot{ width:5px; height:5px; border-radius:50%; display:inline-block; }
.cal-dot.session{ background:var(--accent); }
.cal-dot.review{ background:var(--warn); }

.menu-grid{ display:flex; flex-direction:column; gap:8px; }
.menu-item{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; color:var(--ink); font-size:14.5px; font-weight:600; cursor:pointer; width:100%; text-align:left; }
.menu-item .chev{ color:var(--ink-faint); }

.goal-val{ font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); margin:6px 0; }

.crash{ padding:40px 20px; text-align:center; }
.crash pre{ white-space:pre-wrap; color:var(--warn); font-size:12px; text-align:left; background:var(--surface); padding:12px; border-radius:8px; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<body>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

// ---- Firebase (sincronização) ----------------------------------------
// Cole aqui a configuração do seu projeto Firebase (Configurações do
// projeto > Geral > "Seus apps" > app Web). Enquanto ficar com o valor
// padrão abaixo, o app funciona normalmente só com armazenamento local.
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyB6Yh8dnAgsPJBJ7W7421qqs6tWOXOV4Bc",
  authDomain: "aprova-1e82f.firebaseapp.com",
  projectId: "aprova-1e82f",
  storageBucket: "aprova-1e82f.firebasestorage.app",
  messagingSenderId: "147112096652",
  appId: "1:147112096652:web:f07a3ae08a6287620fdca9"
};
var SYNCED_MARKER_KEY = 'ciclo_mais_synced_uid_v1';

var firebaseConfigured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'COLOQUE_AQUI');
var auth = null, db = null;
if (firebaseConfigured && typeof firebase !== 'undefined'){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch(e){ console.error('Erro ao iniciar Firebase:', e); firebaseConfigured = false; auth=null; db=null; }
} else if (firebaseConfigured){
  firebaseConfigured = false; // scripts do Firebase não carregaram (offline/bloqueado)
}

var currentUser = null;
var syncBusy = false;
var syncErrorMsg = null;
var lastSyncAt = null;
var unsubscribeSnapshot = null;
var pushDebounceTimer = null;
var applyingRemoteUpdate = false;

var STORAGE_KEY = 'ciclo_mais_estado_v1';
var LADDER = [2,7,16,35];
var SUBJECT_COLORS = ['#E3A72B','#4FAE7C','#5B8DEF','#C1543C','#9B6BD6','#3FB6C9','#D68A3D','#8AA5D6'];
var STUDY_TYPES = ['Teoria','Questões','Revisão','Vídeo-aula','Leitura','Resumo'];
var WEEKDAY_LABELS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var WEEKDAY_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

function storageLoad(){
  if (hasClaudeStorage){
    return window.storage.get(STORAGE_KEY).then(function(res){
      return (res && res.value) ? JSON.parse(res.value) : null;
    }).catch(function(){ return null; });
  }
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  } catch(e){ return Promise.resolve(null); }
}

function storageSave(data){
  var json = JSON.stringify(data);
  if (hasClaudeStorage){
    return window.storage.set(STORAGE_KEY, json).catch(function(){
      try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
    });
  }
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
  return Promise.resolve();
}

function defaultState(){
  return {
    subjects: [], topics: [], sessions: [], questionLogs: [], reviews: [], schedule: [], cycle: [],
    goals: { daily: 120, weekly: 600, monthly: 2400 },
    activeTimer: null,
    cyclePointer: 0, cycleLaps: 0, restDays: [],
    ui: { tab:'hoje', subScreen:null, calMonth:null, expandedSubject:null, selectedCalDay:null,
          editingSubject:null, confirmDeleteSubject:null, confirmReset:false, preselectSubject:null,
          syncConflict:null, scheduleDay:null, confirmAutoSchedule:false,
          editingScheduleBlock:null, editingCycleItem:null }
  };
}

var state = defaultState();

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDaysStr(dateStr, n){
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function daysDiffStr(fromStr, toStr){
  var a = fromStr.split('-').map(Number), b = toStr.split('-').map(Number);
  var da = new Date(a[0],a[1]-1,a[2]).getTime(), db = new Date(b[0],b[1]-1,b[2]).getTime();
  return Math.round((db-da)/86400000);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDur(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  var h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60);
  if (h>0) return h + 'h ' + m + 'min';
  if (m>0) return m + 'min';
  return totalSeconds + 's';
}
function fmtHMS(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  var h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60), s = totalSeconds%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDateBR(dateStr){ var p = dateStr.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtPct(x){ return Math.round(x*100) + '%'; }

function subjectById(id){ return state.subjects.find(function(s){ return s.id===id; }); }
function topicById(id){ return state.topics.find(function(t){ return t.id===id; }); }
function topicsForSubject(subjectId){ return state.topics.filter(function(t){ return t.subjectId===subjectId; }); }

function accuracyForSubject(subjectId){
  var logs = state.questionLogs.filter(function(q){ return q.subjectId===subjectId; });
  var total = logs.reduce(function(s,q){ return s+q.total; },0);
  var correct = logs.reduce(function(s,q){ return s+q.correct; },0);
  if (total===0) return null;
  return correct/total;
}

function lastActivityDateForSubject(subjectId){
  var last = null;
  state.sessions.filter(function(s){ return s.subjectId===subjectId; }).forEach(function(s){
    if (!last || s.date > last) last = s.date;
  });
  state.reviews.filter(function(r){ return r.subjectId===subjectId && r.done && r.doneDate; }).forEach(function(r){
    if (!last || r.doneDate > last) last = r.doneDate;
  });
  return last;
}

function computePriority(subject){
  var today = todayStr();
  var acc = accuracyForSubject(subject.id);
  var accuracy = acc===null ? 0.5 : acc;
  var deficitFactor = 1 + (1-accuracy)*4;
  var last = lastActivityDateForSubject(subject.id);
  var daysSince = last ? Math.max(0, daysDiffStr(last, today)) : 999;
  var timeFactor = 1 + Math.min(daysSince/7, 4);
  var priority = subject.weight * subject.difficulty * deficitFactor * timeFactor;
  return { priority: priority, accuracy: acc, daysSince: last ? daysSince : null, deficitFactor: deficitFactor, timeFactor: timeFactor };
}

function rankedSubjects(){
  return state.subjects.map(function(s){ return { subject: s, calc: computePriority(s) }; })
    .sort(function(a,b){ return b.calc.priority - a.calc.priority; });
}

function sessionsInRange(fromStr, toStr){
  return state.sessions.filter(function(s){ return s.date >= fromStr && s.date <= toStr; });
}
function secondsInRange(fromStr, toStr){
  return sessionsInRange(fromStr,toStr).reduce(function(sum,s){ return sum+s.seconds; },0);
}
function secondsToday(){ var t=todayStr(); return secondsInRange(t,t); }
function startOfWeekStr(){
  var d = new Date(); d.setDate(d.getDate()-d.getDay());
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function startOfMonthStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01';
}
function secondsThisWeek(){ return secondsInRange(startOfWeekStr(), todayStr()); }
function secondsThisMonth(){ return secondsInRange(startOfMonthStr(), todayStr()); }

function currentStreak(){
  var daysWithSession = new Set(state.sessions.map(function(s){ return s.date; }));
  var streak = 0, cursor = todayStr();
  if (!daysWithSession.has(cursor)) cursor = addDaysStr(cursor,-1);
  while (daysWithSession.has(cursor)){ streak++; cursor = addDaysStr(cursor,-1); }
  return streak;
}

function overdueReviews(){
  var t = todayStr();
  return state.reviews.filter(function(r){ return !r.done && r.dueDate < t; })
    .sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : 1; });
}
function todayReviews(){
  var t = todayStr();
  return state.reviews.filter(function(r){ return !r.done && r.dueDate === t; });
}
function upcomingReviews(days){
  var t = todayStr(), limit = addDaysStr(t, days);
  return state.reviews.filter(function(r){ return !r.done && r.dueDate > t && r.dueDate <= limit; })
    .sort(function(a,b){ return a.dueDate < b.dueDate ? -1 : 1; });
}

function scheduleReviewIfNeeded(subjectId, topicId){
  var tId = topicId || null;
  var exists = state.reviews.some(function(r){ return !r.done && r.subjectId===subjectId && (r.topicId||null)===tId; });
  if (exists) return;
  state.reviews.push({ id:uid(), subjectId:subjectId, topicId:tId, dueDate:addDaysStr(todayStr(), LADDER[0]), stage:0, done:false, doneDate:null });
}

function completeReview(reviewId, seconds){
  var r = state.reviews.find(function(x){ return x.id===reviewId; });
  if (!r) return;
  r.done = true; r.doneDate = todayStr();
  if (seconds && seconds>0){
    state.sessions.push({ id:uid(), subjectId:r.subjectId, topicId:r.topicId, type:'Revisão', seconds:seconds, date:todayStr(), source:'revisao', ts:Date.now() });
  }
  var nextStage = r.stage+1;
  var interval = LADDER[Math.min(nextStage, LADDER.length-1)];
  state.reviews.push({ id:uid(), subjectId:r.subjectId, topicId:r.topicId, dueDate:addDaysStr(todayStr(), interval), stage:nextStage, done:false, doneDate:null });
}

function hasPendingReview(subjectId, topicId){
  var t = todayStr();
  return state.reviews.some(function(r){
    return !r.done && r.dueDate<=t && r.subjectId===subjectId && (r.topicId||null)===(topicId||null);
  });
}

// ---- Cronograma semanal (template recorrente por dia da semana) ------
function todayWeekday(){ return new Date().getDay(); }
function blocksForWeekday(wd){
  return state.schedule.filter(function(b){ return b.weekday===wd; });
}
function scheduleMinutesForWeekday(wd){
  return blocksForWeekday(wd).reduce(function(s,b){ return s+b.minutes; },0);
}
function scheduleWeeklyMinutes(){
  return state.schedule.reduce(function(s,b){ return s+b.minutes; },0);
}
function isBlockDoneOn(block, dateStr){
  return !!(block.doneDates && block.doneDates.indexOf(dateStr)>-1);
}
function completeScheduleBlock(blockId){
  var b = state.schedule.find(function(x){ return x.id===blockId; });
  if (!b) return;
  var t = todayStr();
  if (isBlockDoneOn(b, t)) return;
  if (!b.doneDates) b.doneDates = [];
  b.doneDates.push(t);
  state.sessions.push({ id:uid(), subjectId:b.subjectId, topicId:b.topicId, type:b.type, seconds:b.minutes*60, date:t, source:'cronograma', ts:Date.now() });
  scheduleReviewIfNeeded(b.subjectId, b.topicId);
}
function autoGenerateSchedule(){
  if (state.subjects.length===0) return;
  var activeDays = [0,1,2,3,4,5,6].filter(function(d){ return state.restDays.indexOf(d)===-1; });
  if (activeDays.length===0) return;
  var ranked = rankedSubjects();
  var totalP = ranked.reduce(function(s,r){ return s+r.calc.priority; },0) || 1;
  var blockMin = 50;
  var totalBlocks = Math.max(ranked.length, Math.round((state.goals.weekly||600)/blockMin));
  totalBlocks = Math.min(totalBlocks, 28);
  var counts = ranked.map(function(r){ return Math.max(1, Math.round(r.calc.priority/totalP*totalBlocks)); });
  var dayLoad = {}; activeDays.forEach(function(d){ dayLoad[d]=0; });
  var newBlocks = [];
  ranked.forEach(function(r,idx){
    var suggestedType = hasPendingReview(r.subject.id, null) ? 'Revisão' : 'Teoria';
    for (var k=0;k<counts[idx];k++){
      var day = activeDays[0];
      activeDays.forEach(function(d){ if (dayLoad[d] < dayLoad[day]) day = d; });
      newBlocks.push({ id:uid(), weekday:day, subjectId:r.subject.id, topicId:null, type:suggestedType, minutes:blockMin, doneDates:[] });
      dayLoad[day] += blockMin;
    }
  });
  state.schedule = newBlocks;
}

// ---- Ciclo de estudos rotativo (fila sequencial, sem depender de dia) ----
function currentCycleIndex(){
  if (!state.cycle.length) return -1;
  return ((state.cyclePointer % state.cycle.length) + state.cycle.length) % state.cycle.length;
}
function currentCycleItem(){
  var i = currentCycleIndex();
  return i>-1 ? state.cycle[i] : null;
}
function advanceCycle(logSession){
  var idx = currentCycleIndex();
  if (idx<0) return;
  var item = state.cycle[idx];
  if (logSession){
    state.sessions.push({ id:uid(), subjectId:item.subjectId, topicId:item.topicId, type:item.type, seconds:item.minutes*60, date:todayStr(), source:'ciclo', ts:Date.now() });
    scheduleReviewIfNeeded(item.subjectId, item.topicId);
  }
  var next = idx+1;
  if (next>=state.cycle.length){ next=0; state.cycleLaps=(state.cycleLaps||0)+1; }
  state.cyclePointer = next;
}


function persist(){ storageSave(state); if (!applyingRemoteUpdate) scheduleCloudPush(); }
function persistLocalOnly(){ storageSave(state); }

function smallGet(key){
  if (hasClaudeStorage){
    return window.storage.get(key).then(function(r){ return r?r.value:null; }).catch(function(){ return null; });
  }
  try{ return Promise.resolve(localStorage.getItem(key)); }catch(e){ return Promise.resolve(null); }
}
function smallSet(key, value){
  if (hasClaudeStorage){ return window.storage.set(key, value).catch(function(){}); }
  try{ localStorage.setItem(key, value); }catch(e){}
  return Promise.resolve();
}

function applyCloudPayload(payload){
  try{
    var incoming = JSON.parse(payload);
    if (!incoming || !Array.isArray(incoming.subjects)) return;
    var d = defaultState();
    applyingRemoteUpdate = true;
    state = Object.assign(d, incoming, { ui: state.ui, activeTimer: state.activeTimer });
    persistLocalOnly();
  } catch(e){ console.error(e); }
  finally { applyingRemoteUpdate = false; }
}

function scheduleCloudPush(){
  if (!currentUser || !db) return;
  clearTimeout(pushDebounceTimer);
  pushDebounceTimer = setTimeout(function(){ pushToCloud(); }, 1200);
}

function pushToCloud(){
  if (!currentUser || !db) return;
  var toSend = Object.assign({}, state, { activeTimer: null });
  var payload = JSON.stringify(toSend);
  db.collection('users').doc(currentUser.uid).set({
    payload: payload,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(function(){
    lastSyncAt = Date.now();
    var el = document.getElementById('syncStatusLine');
    if (el) el.textContent = 'Sincronizado às ' + new Date(lastSyncAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }).catch(function(e){ console.error(e); syncErrorMsg = 'Falha ao sincronizar. Vamos tentar de novo em breve.'; });
}

function startRealtimeListener(uid){
  stopRealtimeListener();
  unsubscribeSnapshot = db.collection('users').doc(uid).onSnapshot(function(snap){
    if (!snap.exists) return;
    var data = snap.data();
    if (!data || !data.payload) return;
    applyCloudPayload(data.payload);
    lastSyncAt = Date.now();
    render();
  }, function(err){ console.error(err); });
}
function stopRealtimeListener(){
  if (unsubscribeSnapshot){ unsubscribeSnapshot(); unsubscribeSnapshot = null; }
}

function handleSignedIn(user){
  currentUser = user; syncBusy = false; syncErrorMsg = null;
  render();
  smallGet(SYNCED_MARKER_KEY).then(function(linkedUid){
    db.collection('users').doc(user.uid).get().then(function(docSnap){
      var hasCloudData = docSnap.exists && docSnap.data() && docSnap.data().payload;
      var hasLocalData = state.subjects.length>0 || state.sessions.length>0;

      if (linkedUid === user.uid){
        if (hasCloudData) applyCloudPayload(docSnap.data().payload);
        startRealtimeListener(user.uid);
        lastSyncAt = Date.now();
        render();
        return;
      }
      if (hasCloudData && hasLocalData){
        state.ui.syncConflict = { payload: docSnap.data().payload };
        render();
        return;
      }
      if (hasCloudData && !hasLocalData){ applyCloudPayload(docSnap.data().payload); }
      smallSet(SYNCED_MARKER_KEY, user.uid);
      startRealtimeListener(user.uid);
      if (!hasCloudData) pushToCloud();
      render();
    }).catch(function(e){
      console.error(e);
      syncErrorMsg = 'Não foi possível verificar seus dados na nuvem.';
      render();
    });
  });
}

function signInWithGoogle(){
  if (!auth) return;
  syncErrorMsg = null; syncBusy = true; render();
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(e){
    console.error(e);
    syncErrorMsg = 'Não foi possível entrar. Tente novamente.';
    syncBusy = false; render();
  });
}
function signOutUser(){
  stopRealtimeListener();
  if (auth) auth.signOut();
  currentUser = null; render();
}

function renderHoje(){
  var ranked = rankedSubjects();
  var goalDaily = state.goals.daily*60;
  var todaySec = secondsToday();
  var pct = goalDaily>0 ? (todaySec/goalDaily*100) : 0;
  var overdue = overdueReviews();
  var dueToday = todayReviews();

  var rankedHtml;
  if (ranked.length===0){
    rankedHtml = emptyState('Nenhuma disciplina ainda', 'Cadastre suas disciplinas com peso e dificuldade pra eu calcular o que priorizar hoje.') +
      '<button class="btn btn-accent btn-block" data-action="goto-tab" data-tab="disciplinas">+ Cadastrar disciplina</button>';
  } else {
    var maxP = ranked[0].calc.priority || 1;
    rankedHtml = ranked.map(function(r,i){
      var s = r.subject;
      var accTxt = r.calc.accuracy===null ? 'sem dados de questões' : fmtPct(r.calc.accuracy)+' de acerto';
      var timeTxt = r.calc.daysSince===null ? 'nunca estudada' : (r.calc.daysSince===0?'estudada hoje':r.calc.daysSince+'d sem atividade');
      var barPct = Math.max(6, r.calc.priority/maxP*100);
      return '<div class="priority-card">'+
        '<div class="priority-rank">#'+(i+1)+'</div>'+
        '<div class="priority-main">'+
          '<div class="priority-top">'+subjectColorDot(s)+'<span class="priority-name">'+esc(s.name)+'</span><span class="priority-score">'+r.calc.priority.toFixed(1)+'</span></div>'+
          '<div class="priority-bar-track"><div class="priority-bar-fill" style="width:'+barPct+'%; background:'+s.color+'"></div></div>'+
          '<div class="priority-meta">'+esc(accTxt)+' · '+esc(timeTxt)+' · peso '+s.weight+' · dificuldade '+s.difficulty+'</div>'+
        '</div>'+
        '<button class="btn btn-sm btn-accent" data-action="start-from-priority" data-subject="'+s.id+'">Iniciar</button>'+
      '</div>';
    }).join('');
  }

  var remindersHtml = '';
  if ((overdue.length+dueToday.length)>0){
    remindersHtml = '<div class="alert-card" data-action="goto-tab" data-tab="revisoes"><strong>'+(overdue.length+dueToday.length)+'</strong> revisão(ões) pendente(s) hoje'+(overdue.length>0?' · '+overdue.length+' atrasada(s)':'')+'</div>';
  }

  var todayBlocks = blocksForWeekday(todayWeekday());
  var todayD = todayStr();
  var schedHtml;
  if (todayBlocks.length){
    var doneCount = todayBlocks.filter(function(b){ return isBlockDoneOn(b, todayD); }).length;
    schedHtml = '<div class="section-title">Cronograma de hoje ('+doneCount+'/'+todayBlocks.length+')</div>' +
      todayBlocks.map(function(b){
        var s = subjectById(b.subjectId);
        var t = b.topicId ? topicById(b.topicId) : null;
        var done = isBlockDoneOn(b, todayD);
        return '<div class="sched-row">'+subjectColorDot(s)+
          '<div class="sched-info"><div class="sched-name">'+esc(s?s.name:'?')+(t?' · '+esc(t.name):'')+'</div>'+
          '<div class="sched-sub">'+esc(b.type)+' · '+fmtDur(b.minutes*60)+'</div></div>'+
          (done ? chip('Concluído','good') : '<button class="btn btn-sm btn-accent" data-action="complete-schedule-block" data-id="'+b.id+'">Concluir</button>')+
        '</div>';
      }).join('');
  } else {
    schedHtml = '<div class="section-title">Cronograma de hoje</div>'+
      (state.restDays.indexOf(todayWeekday())>-1 ?
        '<div class="card"><div class="empty-msg-sm">Hoje é dia de descanso 🌙 Aproveite pra recarregar.</div></div>' :
        '<div class="card"><div class="empty-msg-sm">Nada planejado pra hoje.</div>'+
        '<button class="btn btn-outline btn-block" data-action="goto-cronograma">Planejar cronograma</button></div>');
  }

  var cycleIdx = currentCycleIndex();
  var cycleHtml = '';
  if (cycleIdx>-1){
    var curItem = state.cycle[cycleIdx];
    var curSubj = subjectById(curItem.subjectId);
    var curTopic = curItem.topicId ? topicById(curItem.topicId) : null;
    cycleHtml = '<div class="section-title">Próximo no ciclo</div>'+
      '<div class="sched-row">'+subjectColorDot(curSubj)+
        '<div class="sched-info"><div class="sched-name">'+esc(curSubj?curSubj.name:'?')+(curTopic?' · '+esc(curTopic.name):'')+'</div>'+
        '<div class="sched-sub">'+esc(curItem.type)+' · '+fmtDur(curItem.minutes*60)+'</div></div>'+
        '<button class="btn btn-sm btn-accent" data-action="complete-cycle-item" data-id="'+curItem.id+'">Concluir</button>'+
      '</div>';
  }

  var dateLabel = new Date().toLocaleDateString('pt-BR',{weekday:'long', day:'numeric', month:'long'});

  return screenHeader('Aprova') +
    '<div class="screen-body">'+
      '<div class="hero-card"><div class="hero-date">'+esc(dateLabel)+'</div><div class="hero-goal-label">Meta de hoje</div>'+
      progressBar(pct, pct>=100?'good':'accent')+
      '<div class="hero-goal-value">'+fmtDur(todaySec)+' de '+fmtDur(goalDaily)+'</div></div>'+
      remindersHtml+
      cycleHtml+
      schedHtml+
      '<div class="section-title">Prioridade de hoje</div>'+
      rankedHtml+
    '</div>';
}

    } else {
      var subjOptions = state.subjects.map(function(s){ return '<option value="'+s.id+'" '+(state.ui.preselectSubject===s.id?'selected':'')+'>'+esc(s.name)+'</option>'; }).join('');
      body = '<div class="card">'+

  } else {
    var subject = subjectById(timer.subjectId);

    body = '<div class="timer-card">'+
      '<div class="timer-subject">'+subjectColorDot(subject)+' '+esc(subject?subject.name:'')+(topic?' · '+esc(topic.name):'')+'</div>'+
      '<div class="timer-display" id="timerDisplay">00:00:00</div>'+
      '<div class="timer-status">'+(timer.pausedAt?'Pausado':'Em andamento')+'</div>'+
      '<div class="timer-actions">'+
        (timer.pausedAt ? '<button class="btn btn-accent" data-action="resume-timer">Retomar</button>' : '<button class="btn btn-outline" data-action="pause-timer">Pausar</button>')+
        '<button class="btn btn-danger" data-action="stop-timer">Finalizar</button>'+
      '</div></div>';
  }
  return screenHeader('Cronômetro') + '<div class="screen-body">' + body + '</div>';
}

function reviewRow(r, tone){
  var s = subjectById(r.subjectId);
  var t = r.topicId ? topicById(r.topicId) : null;
  var label = tone==='atrasada' ? ('atrasada há '+Math.abs(daysDiffStr(r.dueDate, todayStr()))+'d')
    : tone==='hoje' ? 'hoje' : ('em '+daysDiffStr(todayStr(), r.dueDate)+'d');
  return '<div class="review-row">'+subjectColorDot(s)+
    '<div class="review-info"><div class="review-name">'+esc(s?s.name:'?')+(t?' · '+esc(t.name):'')+'</div>'+
    '<div class="review-when review-'+tone+'">'+label+'</div></div>'+
    '<button class="btn btn-sm btn-accent" data-action="complete-review" data-id="'+r.id+'">Revisado</button>'+
  '</div>';
}

function renderRevisoes(){
  var overdue = overdueReviews(), today = todayReviews(), upcoming = upcomingReviews(14);
  var html = '';
  if (overdue.length===0 && today.length===0 && upcoming.length===0){
    html = emptyState('Sem revisões por aqui', 'Revisões são agendadas automaticamente quando você registra um estudo.');
  } else {
    if (overdue.length) html += '<div class="section-title warn-title">Atrasadas</div>' + overdue.map(function(r){ return reviewRow(r,'atrasada'); }).join('');
    if (today.length) html += '<div class="section-title">Hoje</div>' + today.map(function(r){ return reviewRow(r,'hoje'); }).join('');
    if (upcoming.length) html += '<div class="section-title">Próximos 14 dias</div>' + upcoming.map(function(r){ return reviewRow(r,'futuro'); }).join('');
  }
  return screenHeader('Revisões') + '<div class="screen-body">' + html + '</div>';
}

function renderQuestoes(){

      '<button class="btn btn-accent btn-block" type="submit">Salvar</button>'+
    '</form>';

  return screenHeader('Questões & Desempenho', {back:'back-to-more'}) + '<div class="screen-body">'+
    '<div class="card"><div class="section-title">Registrar questões</div>'+formBlock+'</div>'+
    (summary?'<div class="section-title">Desempenho por disciplina</div>'+summary:'')+
    (recent?'<div class="section-title">Últimos registros</div><div class="card">'+recent+'</div>':'')+

function renderDashboard(){
  var todaySec = secondsToday(), weekSec = secondsThisWeek(), streak = currentStreak();
  var from = addDaysStr(todayStr(), -29);
  var bySubject = {};
  sessionsInRange(from, todayStr()).forEach(function(s){ bySubject[s.subjectId] = (bySubject[s.subjectId]||0) + s.seconds; });
  var vals = Object.keys(bySubject).map(function(k){ return bySubject[k]; });
  var maxSec = vals.length ? Math.max.apply(null, vals) : 1;
  var distHtml;
  if (Object.keys(bySubject).length){
    distHtml = state.subjects.filter(function(s){ return bySubject[s.id]; })
      .sort(function(a,b){ return bySubject[b.id]-bySubject[a.id]; })
      .map(function(s){
        return '<div class="dist-row"><div class="dist-label">'+subjectColorDot(s)+esc(s.name)+'</div>'+
          '<div class="pbar"><div class="pbar-fill" style="width:'+(bySubject[s.id]/maxSec*100)+'%; background:'+s.color+'"></div></div>'+
          '<div class="dist-val">'+fmtDur(bySubject[s.id])+'</div></div>';
      }).join('');
  } else { distHtml = emptyState('Sem estudos nos últimos 30 dias',''); }

  var days = []; for (var i=0;i<7;i++) days.push(addDaysStr(todayStr(), -6+i));
  var daySecs = days.map(function(d){ return secondsInRange(d,d); });
  var maxDay = Math.max.apply(null, daySecs.concat([1]));
  var evoHtml = '<div class="evo-chart">' + days.map(function(d,i){
    var h = Math.max(4, daySecs[i]/maxDay*80);
    var wd = new Date(d+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'narrow'});
    return '<div class="evo-col"><div class="evo-bar" style="height:'+h+'px"></div><div class="evo-label">'+wd+'</div></div>';
  }).join('') + '</div>';

  return screenHeader('Dashboard', {back:'back-to-more'}) + '<div class="screen-body">'+
    '<div class="stat-grid">'+
      '<div class="stat-box"><div class="stat-value">'+fmtDur(todaySec)+'</div><div class="stat-label">Hoje</div></div>'+
      '<div class="stat-box"><div class="stat-value">'+fmtDur(weekSec)+'</div><div class="stat-label">Semana</div></div>'+
      '<div class="stat-box"><div class="stat-value">'+streak+'d</div><div class="stat-label">Sequência</div></div>'+
    '</div>'+
    '<div class="section-title">Distribuição por disciplina (30 dias)</div><div class="card">'+distHtml+'</div>'+
    '<div class="section-title">Últimos 7 dias</div><div class="card">'+evoHtml+'</div>'+
  '</div>';
}

function renderCalendario(){
  var base = state.ui.calMonth ? new Date(state.ui.calMonth+'-01T00:00:00') : new Date();
  var year = base.getFullYear(), month = base.getMonth();
  var firstDay = new Date(year, month, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var monthLabel = firstDay.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  var sessionDays = new Set(state.sessions.map(function(s){ return s.date; }));
  var reviewDays = new Set(state.reviews.map(function(r){ return r.dueDate; }));

  var cells = '';
  for (var i=0;i<startWeekday;i++) cells += '<div class="cal-cell empty"></div>';
  for (var d=1; d<=daysInMonth; d++){
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var hasSession = sessionDays.has(dateStr), hasReview = reviewDays.has(dateStr);
    var isToday = dateStr===todayStr(), isSelected = state.ui.selectedCalDay===dateStr;
    cells += '<div class="cal-cell '+(isToday?'today':'')+' '+(isSelected?'selected':'')+'" data-action="select-cal-day" data-date="'+dateStr+'">'+
      '<span class="cal-day-num">'+d+'</span><span class="cal-dots">'+(hasSession?'<i class="cal-dot session"></i>':'')+(hasReview?'<i class="cal-dot review"></i>':'')+'</span></div>';
  }

  var detail = '';
  if (state.ui.selectedCalDay){
    var dsel = state.ui.selectedCalDay;
    var daySessions = state.sessions.filter(function(s){ return s.date===dsel; });
    var dayReviews = state.reviews.filter(function(r){ return r.dueDate===dsel; });
    detail = '<div class="card"><div class="section-title">'+fmtDateBR(dsel)+'</div>'+
      (daySessions.length ? daySessions.map(function(s){ var sub=subjectById(s.subjectId); return '<div class="q-row"><span>'+esc(sub?sub.name:'?')+' · '+esc(s.type)+'</span><span>'+fmtDur(s.seconds)+'</span></div>'; }).join('') : '<div class="empty-msg-sm">Sem estudos.</div>')+
      (dayReviews.length ? dayReviews.map(function(r){ var sub=subjectById(r.subjectId); return '<div class="q-row"><span>Revisão · '+esc(sub?sub.name:'?')+'</span><span>'+(r.done?'feita':'pendente')+'</span></div>'; }).join('') : '')+
    '</div>';
  }

  return screenHeader('Calendário', {back:'back-to-more'}) + '<div class="screen-body">'+
    '<div class="cal-nav"><button class="icon-btn" data-action="cal-prev-month">‹</button><div class="cal-month-label">'+esc(monthLabel)+'</div><button class="icon-btn" data-action="cal-next-month">›</button></div>'+
    '<div class="cal-weekdays">'+['D','S','T','Q','Q','S','S'].map(function(w){ return '<div>'+w+'</div>'; }).join('')+'</div>'+
    '<div class="cal-grid">'+cells+'</div>'+detail+
  '</div>';
}

function goalBlock(label, goalMin, actualSec, key){

  return '<div class="card"><div class="section-title">'+label+'</div>'+progressBar(pct, pct>=100?'good':'accent')+

    '<form data-action="update-goal" data-key="'+key+'" class="inline-form">'+
      '<input type="number" name="hours" min="0" step="0.5" value="'+(goalMin/60).toFixed(1)+'" />'+
      '<span class="unit-label">horas</span><button class="btn btn-sm btn-outline" type="submit">Salvar</button>'+
    '</form></div>';
}
function renderMetas(){

  return screenHeader('Metas', {back:'back-to-more'}) + '<div class="screen-body">'+
    goalBlock('Meta diária', g.daily, secondsToday(), 'daily')+
    goalBlock('Meta semanal', g.weekly, secondsThisWeek(), 'weekly')+

}

function renderEstatisticas(){
  var streak = currentStreak();
  var daysWithSession = Array.from(new Set(state.sessions.map(function(s){ return s.date; }))).sort();
  var best=0, run=0, prevDate=null;
  daysWithSession.forEach(function(d){
    if (prevDate && daysDiffStr(prevDate,d)===1) run++; else run=1;
    if (run>best) best=run;
    prevDate=d;
  });
  var totalSec = state.sessions.reduce(function(s,x){ return s+x.seconds; },0);
  var avgDaily = secondsInRange(addDaysStr(todayStr(),-29), todayStr())/30;

  var byType = {};
  state.sessions.forEach(function(s){ byType[s.type]=(byType[s.type]||0)+s.seconds; });
  var typeTotal = Object.keys(byType).reduce(function(a,k){ return a+byType[k]; },0) || 1;
  var typeHtml = Object.keys(byType).length ? Object.keys(byType).sort(function(a,b){ return byType[b]-byType[a]; }).map(function(t){
    return '<div class="dist-row"><div class="dist-label">'+esc(t)+'</div>'+progressBar(byType[t]/typeTotal*100,'accent')+'<div class="dist-val">'+fmtPct(byType[t]/typeTotal)+'</div></div>';
  }).join('') : emptyState('Sem dados ainda','');

  var bySubjTime = {};
  state.sessions.forEach(function(s){ bySubjTime[s.subjectId]=(bySubjTime[s.subjectId]||0)+s.seconds; });
  var topIds = Object.keys(bySubjTime).sort(function(a,b){ return bySubjTime[b]-bySubjTime[a]; });
  var topSubject = topIds.length ? subjectById(topIds[0]) : null;

  var accEntries = state.subjects.map(function(s){ return {s:s, acc:accuracyForSubject(s.id)}; }).filter(function(x){ return x.acc!==null; }).sort(function(a,b){ return a.acc-b.acc; });
  var weakest = accEntries.length ? accEntries[0] : null;

  return screenHeader('Estatísticas', {back:'back-to-more'}) + '<div class="screen-body">'+
    '<div class="stat-grid">'+
      '<div class="stat-box"><div class="stat-value">'+streak+'d</div><div class="stat-label">Sequência atual</div></div>'+
      '<div class="stat-box"><div class="stat-value">'+best+'d</div><div class="stat-label">Melhor sequência</div></div>'+
      '<div class="stat-box"><div class="stat-value">'+fmtDur(totalSec)+'</div><div class="stat-label">Total estudado</div></div>'+
    '</div>'+
    '<div class="card"><div class="q-row"><span>Média diária (30d)</span><span>'+fmtDur(avgDaily)+'</span></div>'+
    (topSubject?'<div class="q-row"><span>Disciplina mais estudada</span><span>'+esc(topSubject.name)+'</span></div>':'')+
    (weakest?'<div class="q-row"><span>Maior oportunidade de melhoria</span><span>'+esc(weakest.s.name)+' ('+fmtPct(weakest.acc)+')</span></div>':'')+
    '</div>'+
    '<div class="section-title">Tempo por tipo de estudo</div><div class="card">'+typeHtml+'</div>'+
  '</div>';
}

    return '<div class="card"><div class="section-title">Encontrei dados na nuvem</div>'+

  if (!currentUser){

      (syncErrorMsg?'<p class="muted-text" style="color:var(--warn)">'+esc(syncErrorMsg)+'</p>':'')+
      '</div>';
  }
  var statusLine = lastSyncAt ? ('Sincronizado às '+new Date(lastSyncAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})) : 'Aguardando primeira sincronização…';
  return '<div class="card"><div class="section-title">Sincronização</div>'+
    '<p class="muted-text">Conectado como '+esc(currentUser.email||currentUser.displayName||'')+'</p>'+
    '<p class="muted-text" id="syncStatusLine">'+statusLine+'</p>'+
    (syncErrorMsg?'<p class="muted-text" style="color:var(--warn)">'+esc(syncErrorMsg)+'</p>':'')+
    '<button class="btn btn-outline btn-block" data-action="sync-sign-out">Sair da conta</button></div>';

function renderCronograma(){
  if (state.subjects.length===0){
    return screenHeader('Cronograma da semana', {back:'back-to-more'}) + '<div class="screen-body">'+
      emptyState('Cadastre uma disciplina primeiro','Vá em Disciplinas para adicionar suas matérias antes de montar o cronograma.')+
      '<button class="btn btn-accent btn-block" data-action="goto-tab" data-tab="disciplinas">+ Cadastrar disciplina</button>'+
    '</div>';
  }

  var selDay = state.ui.scheduleDay!=null ? state.ui.scheduleDay : todayWeekday();
  var isRest = state.restDays.indexOf(selDay)>-1;

  var weekTotal = scheduleWeeklyMinutes();
  var maxDay = 1;
  for (var di=0; di<7; di++){ maxDay = Math.max(maxDay, scheduleMinutesForWeekday(di)); }
  var distHtml = WEEKDAY_SHORT.map(function(lbl,i){
    var m = scheduleMinutesForWeekday(i);
    var restBadge = state.restDays.indexOf(i)>-1 ? ' 🌙' : '';
    return '<div class="dist-row"><div class="dist-label">'+lbl+restBadge+'</div>'+
      '<div class="pbar"><div class="pbar-fill pbar-accent" style="width:'+(m/maxDay*100)+'%"></div></div>'+
      '<div class="dist-val">'+fmtDur(m*60)+'</div></div>';
  }).join('');

  var summaryHtml = '<div class="card"><div class="section-title">Resumo da semana</div>'+distHtml+
    '<div class="goal-val">Planejado: '+fmtDur(weekTotal*60)+' de '+fmtDur((state.goals.weekly||0)*60)+' (meta semanal)</div>'+
    '<button class="btn btn-sm '+(state.ui.confirmAutoSchedule?'btn-danger armed':'btn-outline')+' btn-block" data-action="auto-generate-schedule">'+
      (state.ui.confirmAutoSchedule?'Confirmar: substituir cronograma atual':'✨ Gerar sugestão automática')+
    '</button>'+
    '<p class="empty-msg-sm">A sugestão usa o algoritmo de prioridade pra distribuir as disciplinas pela semana (pulando dias de descanso 🌙) e já marca "Revisão" pra quem tem revisão pendente. O cronograma se repete toda semana — blocos concluídos voltam a ficar em aberto na semana seguinte.</p>'+
  '</div>';

  var dayTabs = '<div class="wd-tabs">' + WEEKDAY_SHORT.map(function(lbl,i){
    var rest = state.restDays.indexOf(i)>-1;
    return '<button class="wd-tab '+(selDay===i?'active':'')+(rest?' rest':'')+'" data-action="select-schedule-day" data-day="'+i+'">'+(rest?'🌙 ':'')+lbl+'</button>';
  }).join('') + '</div>';

  var restToggleHtml = '<div class="card" style="padding:12px 14px;">'+
    '<label class="toggle-row">'+
      '<span>🌙 Marcar '+esc(WEEKDAY_LABELS[selDay].toLowerCase())+' como dia de descanso</span>'+
      '<input type="checkbox" data-action="toggle-rest-day" data-day="'+selDay+'" '+(isRest?'checked':'')+' />'+
    '</label>'+
    (isRest?'<p class="empty-msg-sm">Esse dia fica de fora da sugestão automática. Você ainda pode adicionar blocos manualmente aqui se quiser.</p>':'')+
  '</div>';

  var dayBlocks = blocksForWeekday(selDay);
  var blocksHtml;
  if (dayBlocks.length===0){
    blocksHtml = emptyState(isRest?'Dia de descanso 🌙':'Nada planejado para '+WEEKDAY_LABELS[selDay].toLowerCase(), isRest?'Aproveite pra recarregar as energias.':'Adicione blocos de estudo no formulário abaixo.');
  } else {
    blocksHtml = '<div class="sched-day-total">'+fmtDur(scheduleMinutesForWeekday(selDay)*60)+' planejado(s) para '+WEEKDAY_LABELS[selDay].toLowerCase()+'</div>' +
      dayBlocks.map(function(b,idx){
        var s = subjectById(b.subjectId);
        var t = b.topicId ? topicById(b.topicId) : null;
        return '<div class="sched-row">'+subjectColorDot(s)+
          '<div class="sched-info"><div class="sched-name">'+esc(s?s.name:'?')+(t?' · '+esc(t.name):'')+'</div>'+
          '<div class="sched-sub">'+esc(b.type)+' · '+fmtDur(b.minutes*60)+'</div></div>'+
          '<div class="sched-order">'+
            '<button data-action="move-schedule-block" data-id="'+b.id+'" data-dir="up" '+(idx===0?'disabled':'')+'>▲</button>'+
            '<button data-action="move-schedule-block" data-id="'+b.id+'" data-dir="down" '+(idx===dayBlocks.length-1?'disabled':'')+'>▼</button>'+
          '</div>'+
          '<button class="icon-btn-sm" data-action="edit-schedule-block" data-id="'+b.id+'">✎</button>'+
          '<button class="icon-btn-sm" data-action="delete-schedule-block" data-id="'+b.id+'">✕</button>'+
        '</div>';
      }).join('');
  }

  var editingBlock = state.ui.editingScheduleBlock ? state.schedule.find(function(b){ return b.id===state.ui.editingScheduleBlock; }) : null;
  var subjOptions = state.subjects.map(function(s){ return '<option value="'+s.id+'" '+((editingBlock?editingBlock.subjectId:'')===s.id?'selected':'')+'>'+esc(s.name)+'</option>'; }).join('');

var appEl = document.getElementById('app');

function populateTopicSelect(subjSelId, topicSelId, desiredValue){
  var subjSel = document.getElementById(subjSelId);
  var topicSel = document.getElementById(topicSelId);
  if (!subjSel || !topicSel) return;
  var subjectId = subjSel.value;
  var topics = topicsForSubject(subjectId);
  var current = (desiredValue!=null) ? desiredValue : topicSel.value;
  topicSel.innerHTML = '<option value="">—</option>' + topics.map(function(t){ return '<option value="'+t.id+'">'+esc(t.name)+'</option>'; }).join('');
  if (topics.some(function(t){ return t.id===current; })) topicSel.value = current;
}

function suggestTypeForSelects(subjSelId, topicSelId, typeSelId){
  var subjSel = document.getElementById(subjSelId);
  var topicSel = document.getElementById(topicSelId);
  var typeSel = document.getElementById(typeSelId);
  if (!subjSel || !typeSel) return;
  var subjectId = subjSel.value;
  var topicId = topicSel ? (topicSel.value||null) : null;
  if (subjectId && hasPendingReview(subjectId, topicId)){
    typeSel.value = 'Revisão';
  }
}

function timerElapsedMs(t){
  if (!t) return 0;
  var end = t.pausedAt || Date.now();
  return end - t.startedAt - t.totalPausedMs;
}
function updateTimerDisplay(){
  var el = document.getElementById('timerDisplay');
  if (!el || !state.activeTimer) return;
  el.textContent = fmtHMS(timerElapsedMs(state.activeTimer)/1000);
}

function render(){
  try{
    appEl.innerHTML = '<div class="app-inner">'+screenContent()+'</div>'+renderTabBar();
    populateTopicSelect('timerSubject','timerTopic');
    populateTopicSelect('manualSubject','manualTopic');

    var editingBlockForTopic = state.ui.editingScheduleBlock ? state.schedule.find(function(b){ return b.id===state.ui.editingScheduleBlock; }) : null;
    populateTopicSelect('schedSubject','schedTopic', editingBlockForTopic ? (editingBlockForTopic.topicId||'') : undefined);
    if (!editingBlockForTopic) suggestTypeForSelects('schedSubject','schedTopic','schedType');

    var editingCycleForTopic = state.ui.editingCycleItem ? state.cycle.find(function(c){ return c.id===state.ui.editingCycleItem; }) : null;
    populateTopicSelect('cycleSubject','cycleTopic', editingCycleForTopic ? (editingCycleForTopic.topicId||'') : undefined);
    if (!editingCycleForTopic) suggestTypeForSelects('cycleSubject','cycleTopic','cycleType');

    if (state.activeTimer) updateTimerDisplay();
  } catch(err){
    appEl.innerHTML = '<div class="crash"><h2>Ops, algo quebrou</h2><pre>'+esc(err && err.message)+'</pre></div>';
    console.error(err);
  }
}

function exportBackup(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'ciclo-mais-backup-'+todayStr()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

function handleImportFile(file){
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if (!data || !Array.isArray(data.subjects)) throw new Error('formato inválido');
      var d = defaultState();
      state = Object.assign(d, data, { ui: d.ui });
      persist(); render();
    } catch(e){
      console.error(e);
      try{ alert('Não foi possível importar: arquivo inválido.'); }catch(_e){}
    }
  };
  reader.readAsText(file);
}

function shiftCalMonth(delta){
  var base = state.ui.calMonth ? new Date(state.ui.calMonth+'-01T00:00:00') : new Date();
  base.setMonth(base.getMonth()+delta);
  state.ui.calMonth = base.getFullYear()+'-'+String(base.getMonth()+1).padStart(2,'0');
}

appEl.addEventListener('click', function(e){
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  try{
    var action = btn.dataset.action;
    switch(action){
      case 'goto-tab':
        state.ui.tab = btn.dataset.tab;
        if (btn.dataset.tab==='mais') state.ui.subScreen=null;
        state.ui.confirmDeleteSubject=null; state.ui.confirmReset=false;
        state.ui.editingSubject=null; state.ui.preselectSubject=null;
        state.ui.confirmAutoSchedule=false;
        state.ui.editingScheduleBlock=null; state.ui.editingCycleItem=null;
        render();
        break;
      case 'open-sub':
        state.ui.subScreen = btn.dataset.sub; state.ui.confirmReset=false;
        state.ui.confirmAutoSchedule=false;
        state.ui.editingScheduleBlock=null; state.ui.editingCycleItem=null;
        render();
        break;
      case 'back-to-more':
        state.ui.subScreen=null; state.ui.confirmReset=false;
        state.ui.confirmAutoSchedule=false;
        state.ui.editingScheduleBlock=null; state.ui.editingCycleItem=null;
        render();
        break;
      case 'goto-cronograma':
        state.ui.tab='mais'; state.ui.subScreen='cronograma';
        render();
        break;
      case 'goto-ciclo':
        state.ui.tab='mais'; state.ui.subScreen='ciclo';
        render();
        break;
      case 'select-schedule-day':
        state.ui.scheduleDay = Number(btn.dataset.day);
        state.ui.editingScheduleBlock = null;
        render();
        break;
      case 'toggle-rest-day': {
        var rd = Number(btn.dataset.day);
        var rPos = state.restDays.indexOf(rd);
        if (rPos>-1) state.restDays.splice(rPos,1); else state.restDays.push(rd);
        persist(); render();
        break;
      }
      case 'edit-schedule-block':
        state.ui.editingScheduleBlock = btn.dataset.id;
        render();
        break;
      case 'cancel-edit-schedule-block':
        state.ui.editingScheduleBlock = null;
        render();
        break;
      case 'delete-schedule-block':
        state.schedule = state.schedule.filter(function(b){ return b.id!==btn.dataset.id; });
        if (state.ui.editingScheduleBlock===btn.dataset.id) state.ui.editingScheduleBlock=null;
        persist(); render();
        break;
      case 'move-schedule-block': {
        var mDir = btn.dataset.dir;
        var mBlk = state.schedule.find(function(b){ return b.id===btn.dataset.id; });
        if (!mBlk) break;
        var mSameDay = state.schedule.filter(function(b){ return b.weekday===mBlk.weekday; });
        var mPos = mSameDay.indexOf(mBlk);
        var mSwap = mDir==='up' ? mSameDay[mPos-1] : mSameDay[mPos+1];
        if (!mSwap) break;
        var mI1 = state.schedule.indexOf(mBlk), mI2 = state.schedule.indexOf(mSwap);
        state.schedule[mI1] = mSwap; state.schedule[mI2] = mBlk;
        persist(); render();
        break;
      }
      case 'complete-schedule-block':
        completeScheduleBlock(btn.dataset.id);
        persist(); render();
        break;
      case 'auto-generate-schedule':
        if (!state.ui.confirmAutoSchedule){ state.ui.confirmAutoSchedule = true; render(); break; }
        autoGenerateSchedule();
        state.ui.confirmAutoSchedule = false;
        persist(); render();
        break;
      case 'edit-cycle-item':
        state.ui.editingCycleItem = btn.dataset.id;
        render();
        break;
      case 'cancel-edit-cycle-item':
        state.ui.editingCycleItem = null;
        render();
        break;
      case 'delete-cycle-item':
        state.cycle = state.cycle.filter(function(c){ return c.id!==btn.dataset.id; });
        if (state.ui.editingCycleItem===btn.dataset.id) state.ui.editingCycleItem=null;
        persist(); render();
        break;
      case 'move-cycle-item': {
        var cDir = btn.dataset.dir;
        var cIdx = state.cycle.findIndex(function(c){ return c.id===btn.dataset.id; });
        if (cIdx===-1) break;
        var cSwapIdx = cDir==='up' ? cIdx-1 : cIdx+1;
        if (cSwapIdx<0 || cSwapIdx>=state.cycle.length) break;
        var cTmp = state.cycle[cIdx]; state.cycle[cIdx]=state.cycle[cSwapIdx]; state.cycle[cSwapIdx]=cTmp;
        persist(); render();
        break;
      }
      case 'complete-cycle-item':
        advanceCycle(true);
        persist(); render();
        break;
      case 'skip-cycle-item':
        advanceCycle(false);
        persist(); render();
        break;
      case 'toggle-subject':
        state.ui.expandedSubject = state.ui.expandedSubject===btn.dataset.id ? null : btn.dataset.id;
        state.ui.confirmDeleteSubject=null;
        render();
        break;
      case 'edit-subject':
        state.ui.editingSubject = btn.dataset.id;
        render();
        break;
      case 'cancel-edit-subject':
        state.ui.editingSubject = null;
        render();
        break;
      case 'delete-subject': {
        var idDel = btn.dataset.id;
        if (state.ui.confirmDeleteSubject !== idDel){ state.ui.confirmDeleteSubject = idDel; render(); break; }
        state.subjects = state.subjects.filter(function(s){ return s.id!==idDel; });
        state.topics = state.topics.filter(function(t){ return t.subjectId!==idDel; });
        state.sessions = state.sessions.filter(function(s){ return s.subjectId!==idDel; });
        state.questionLogs = state.questionLogs.filter(function(q){ return q.subjectId!==idDel; });
        state.reviews = state.reviews.filter(function(r){ return r.subjectId!==idDel; });
        state.schedule = state.schedule.filter(function(b){ return b.subjectId!==idDel; });
        state.cycle = state.cycle.filter(function(c){ return c.subjectId!==idDel; });
        state.ui.confirmDeleteSubject=null; state.ui.expandedSubject=null;
        persist(); render();
        break;
      }
      case 'delete-topic':
        state.topics = state.topics.filter(function(t){ return t.id!==btn.dataset.id; });
        persist(); render();
        break;
      case 'start-from-priority':
        state.ui.tab='cronometro'; state.ui.preselectSubject = btn.dataset.subject;
        render();
        break;
      case 'start-timer': {
        var subjSel = document.getElementById('timerSubject');
        if (!subjSel || !subjSel.value) break;
        var topicSel = document.getElementById('timerTopic');
        var typeSel = document.getElementById('timerType');
        state.activeTimer = { subjectId: subjSel.value, topicId: topicSel.value||null, type: typeSel.value, startedAt: Date.now(), pausedAt: null, totalPausedMs: 0 };
        persist(); render();
        break;
      }
      case 'pause-timer':
        if (state.activeTimer) state.activeTimer.pausedAt = Date.now();
        persist(); render();
        break;
      case 'resume-timer':
        if (state.activeTimer && state.activeTimer.pausedAt){
          state.activeTimer.totalPausedMs += Date.now()-state.activeTimer.pausedAt;
          state.activeTimer.pausedAt = null;
        }
        persist(); render();
        break;
      case 'stop-timer': {
        if (state.activeTimer){
          var seconds = Math.round(timerElapsedMs(state.activeTimer)/1000);
          var t = state.activeTimer;
          if (seconds>0){
            state.sessions.push({ id:uid(), subjectId:t.subjectId, topicId:t.topicId, type:t.type, seconds:seconds, date:todayStr(), source:'timer', ts:Date.now() });
            scheduleReviewIfNeeded(t.subjectId, t.topicId);
          }
          state.activeTimer = null;
        }
        persist(); render();
        break;
      }
      case 'complete-review':
        completeReview(btn.dataset.id, 15*60);
        persist(); render();
        break;
      case 'export-backup':
        exportBackup();
        break;
      case 'request-notifications':
        if ('Notification' in window){
          Notification.requestPermission().then(function(){ render(); }).catch(function(){});
        }
        break;
      case 'sync-sign-in':
        signInWithGoogle();
        break;
      case 'sync-sign-out':
        signOutUser();
        break;
      case 'sync-use-cloud':
        if (state.ui.syncConflict){
          applyCloudPayload(state.ui.syncConflict.payload);
          state.ui.syncConflict = null;
          if (currentUser){ smallSet(SYNCED_MARKER_KEY, currentUser.uid); startRealtimeListener(currentUser.uid); lastSyncAt = Date.now(); }
        }
        render();
        break;
      case 'sync-use-local':
        if (state.ui.syncConflict){
          state.ui.syncConflict = null;
          if (currentUser){ smallSet(SYNCED_MARKER_KEY, currentUser.uid); startRealtimeListener(currentUser.uid); pushToCloud(); }
        }
        render();
        break;
      case 'reset-data':
        if (!state.ui.confirmReset){ state.ui.confirmReset = true; render(); break; }
        state = defaultState();
        persist(); render();
        break;
      case 'cal-prev-month': shiftCalMonth(-1); render(); break;
      case 'cal-next-month': shiftCalMonth(1); render(); break;
      case 'select-cal-day':
        state.ui.selectedCalDay = state.ui.selectedCalDay===btn.dataset.date ? null : btn.dataset.date;
        render();
        break;
    }
  } catch(err){ console.error(err); }
});

appEl.addEventListener('change', function(e){
  if (e.target.id==='timerSubject') populateTopicSelect('timerSubject','timerTopic');

});

appEl.addEventListener('submit', function(e){
  var form = e.target.closest('[data-action]');
  if (!form) return;
  e.preventDefault();
  try{
    var action = form.dataset.action;
    var fd = new FormData(form);
    switch(action){
      case 'add-subject': {
        var editId = fd.get('editId');
        var name = (fd.get('name')||'').trim();
        if (!name) break;
        var weight = Number(fd.get('weight'))||3;
        var difficulty = Number(fd.get('difficulty'))||3;
        var color = fd.get('color') || SUBJECT_COLORS[0];
        if (editId){
          var s = subjectById(editId);
          if (s){ s.name=name; s.weight=weight; s.difficulty=difficulty; s.color=color; }
          state.ui.editingSubject = null;
        } else {
          state.subjects.push({ id: uid(), name: name, weight: weight, difficulty: difficulty, color: color });
        }
        persist(); render();
        break;
      }
      case 'add-topic': {
        var subjectId = form.dataset.subject;
        var tname = (fd.get('topicName')||'').trim();
        if (!tname) break;
        state.topics.push({ id: uid(), subjectId: subjectId, name: tname });
        persist(); render();
        break;
      }
      case 'add-questions': {
        var qSubjectId = fd.get('subjectId');
        var total = Number(fd.get('total'));
        var correct = Math.min(Number(fd.get('correct')), total);
        if (!qSubjectId || !total || total<1) break;
        state.questionLogs.push({ id: uid(), subjectId: qSubjectId, topicId:null, total: total, correct: Math.max(0,correct), date: todayStr(), ts: Date.now() });
        persist(); render();
        break;
      }
      case 'add-manual-session': {
        var mSubjectId = fd.get('subjectId');
        var mTopicId = fd.get('topicId') || null;
        var mType = fd.get('type');
        var mDate = fd.get('date') || todayStr();
        var minutes = Number(fd.get('minutes'));
        if (!mSubjectId || !minutes || minutes<1) break;
        state.sessions.push({ id: uid(), subjectId: mSubjectId, topicId: mTopicId, type: mType, seconds: minutes*60, date: mDate, source:'manual', ts: Date.now() });
        if (mType !== 'Revisão') scheduleReviewIfNeeded(mSubjectId, mTopicId);
        persist(); render();
        break;
      }
      case 'add-schedule-block': {
        var editId = fd.get('editId');
        var wd = Number(fd.get('weekday'));
        var schedSubjectId = fd.get('subjectId');
        var schedTopicId = fd.get('topicId') || null;
        var schedType = fd.get('type');
        var schedMinutes = Number(fd.get('minutes'));
        if (!schedSubjectId || !schedMinutes || schedMinutes<1) break;
        if (editId){
          var esb = state.schedule.find(function(b){ return b.id===editId; });
          if (esb){ esb.weekday=wd; esb.subjectId=schedSubjectId; esb.topicId=schedTopicId; esb.type=schedType; esb.minutes=schedMinutes; }
          state.ui.editingScheduleBlock = null;
        } else {
          state.schedule.push({ id: uid(), weekday: wd, subjectId: schedSubjectId, topicId: schedTopicId, type: schedType, minutes: schedMinutes, doneDates: [] });
        }
        state.ui.scheduleDay = wd;
        persist(); render();
        break;
      }
      case 'add-cycle-item': {
        var cEditId = fd.get('editId');
        var cSubjectId = fd.get('subjectId');
        var cTopicId = fd.get('topicId') || null;
        var cType = fd.get('type');
        var cMinutes = Number(fd.get('minutes'));
        if (!cSubjectId || !cMinutes || cMinutes<1) break;
        if (cEditId){
          var eci = state.cycle.find(function(c){ return c.id===cEditId; });
          if (eci){ eci.subjectId=cSubjectId; eci.topicId=cTopicId; eci.type=cType; eci.minutes=cMinutes; }
          state.ui.editingCycleItem = null;
        } else {
          state.cycle.push({ id: uid(), subjectId: cSubjectId, topicId: cTopicId, type: cType, minutes: cMinutes });
        }
        persist(); render();
        break;
      }
      case 'update-goal': {
        var key = form.dataset.key;
        var hours = Number(fd.get('hours'))||0;
        state.goals[key] = Math.round(hours*60);
        persist(); render();
        break;
      }
    }
  } catch(err){ console.error(err); }
});

setInterval(function(){ if (state.activeTimer && !state.activeTimer.pausedAt) updateTimerDisplay(); }, 1000);

function init(){
  storageLoad().then(function(loaded){
    if (loaded){
      var d = defaultState();
      state = Object.assign(d, loaded, { ui: Object.assign(d.ui, loaded.ui||{}) });
    }
    render();
    try{
      if ('Notification' in window && Notification.permission==='granted'){
        var n = overdueReviews().length + todayReviews().length;
        if (n>0) new Notification('Aprova', { body: 'Você tem '+n+' revisão(ões) pendente(s) hoje.' });
      }
    }catch(e){}

    if (firebaseConfigured && auth){
      auth.onAuthStateChanged(function(user){
        syncBusy = false;
        if (user){ handleSignedIn(user); }
        else { currentUser = null; stopRealtimeListener(); render(); }
      });
    }
  });
  if ('serviceWorker' in navigator){
    try{ navigator.serviceWorker.register('./sw.js').catch(function(){}); }catch(e){}
  }
}

init();
})();
</script>
