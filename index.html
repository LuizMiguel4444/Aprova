<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Aprova</title>
<meta name="theme-color" content="#0F1220" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<style>
:root{
  --bg:#0F1220; --surface:#171B2E; --surface2:#1F2440; --surface3:#262C4A;
  --border:#2A2F4D; --ink:#ECE9E1; --ink-dim:#9B98AC; --ink-faint:#6B6880;
  --accent:#E3A72B; --accent-dim:#8A6A24; --accent-ink:#231A05;
  --good:#4FAE7C; --good-bg:rgba(79,174,124,.15);
  --warn:#C1543C; --warn-bg:rgba(193,84,60,.15);
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Roboto Mono",Consolas,Menlo,monospace;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{ background:var(--bg); color:var(--ink); font-family:var(--font); -webkit-font-smoothing:antialiased; overscroll-behavior:none; }
button, input, select{ font-family:inherit; }
#app{ max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px; }
.app-inner{ padding:0 0 24px; }

.screen-header{ display:flex; align-items:center; justify-content:space-between; padding:20px 16px 10px; position:sticky; top:0; background:var(--bg); z-index:5; }
.screen-header h1{ font-size:22px; font-weight:700; letter-spacing:-0.02em; margin:0; }
.header-spacer{ width:32px; height:32px; display:inline-block; }
.icon-btn{ width:32px; height:32px; border-radius:50%; border:none; background:var(--surface2); color:var(--ink); display:flex; align-items:center; justify-content:center; cursor:pointer; }
.icon-btn svg{ width:18px; height:18px; }

.screen-body{ padding:0 16px; }

.hero-card{ background:linear-gradient(160deg, var(--surface2), var(--surface)); border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; }
.hero-date{ text-transform:capitalize; color:var(--ink-dim); font-size:13px; margin-bottom:10px; }
.hero-goal-label{ font-size:13px; color:var(--ink-dim); margin-bottom:6px; }
.hero-goal-value{ margin-top:8px; font-family:var(--mono); font-size:14px; color:var(--ink-dim); }

.alert-card{ background:var(--warn-bg); border:1px solid var(--warn); color:var(--ink); padding:12px 14px; border-radius:var(--radius-sm); margin-bottom:16px; cursor:pointer; font-size:14px; }
.alert-card strong{ color:var(--warn); }

.section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin:20px 0 10px; font-weight:600; }
.section-title.warn-title{ color:var(--warn); }

.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px; }

.priority-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; }
.priority-rank{ font-family:var(--mono); font-size:13px; color:var(--ink-faint); width:20px; flex-shrink:0; }
.priority-main{ flex:1; min-width:0; }
.priority-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.priority-name{ font-weight:600; font-size:15px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.priority-score{ font-family:var(--mono); font-size:13px; color:var(--accent); flex-shrink:0; }
.priority-bar-track{ height:5px; background:var(--surface3); border-radius:3px; overflow:hidden; margin-bottom:6px; }
.priority-bar-fill{ height:100%; border-radius:3px; }
.priority-meta{ font-size:11.5px; color:var(--ink-dim); }

.btn{ border:none; border-radius:999px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; }
.btn-block{ width:100%; display:block; margin-top:10px; text-align:center; }
.btn-accent{ background:var(--accent); color:var(--accent-ink); }
.btn-outline{ background:transparent; border:1px solid var(--border); color:var(--ink); }
.btn-danger{ background:transparent; border:1px solid var(--warn); color:var(--warn); }
.btn-danger.armed{ background:var(--warn); color:var(--ink); }
.btn-sm{ padding:7px 12px; font-size:12.5px; }

label{ display:block; font-size:12.5px; color:var(--ink-dim); margin:10px 0 5px; }
input[type=text], input[type=number], input[type=date], select{
  width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--ink);
  border-radius:var(--radius-sm); padding:11px 12px; font-size:14px; appearance:none;
}
input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.inline-form{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.inline-form input{ flex:1; }
.unit-label{ font-size:13px; color:var(--ink-dim); white-space:nowrap; }

.color-picker{ display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 14px; }
.color-opt{ width:30px; height:30px; border-radius:50%; display:inline-flex; cursor:pointer; border:2px solid transparent; position:relative; }
.color-opt input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.color-opt:has(input:checked){ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

.chip{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:600; }
.chip-neutral{ background:var(--surface2); color:var(--ink-dim); }
.chip-good{ background:var(--good-bg); color:var(--good); }
.chip-warn{ background:var(--warn-bg); color:var(--warn); }
.pbar{ height:8px; background:var(--surface3); border-radius:4px; overflow:hidden; }
.pbar-fill{ height:100%; border-radius:4px; }
.pbar-accent{ background:var(--accent); }
.pbar-good{ background:var(--good); }
.pbar-neutral{ background:var(--ink-faint); }
.pbar-warn{ background:var(--warn); }

.empty{ text-align:center; padding:32px 16px; color:var(--ink-dim); }
.empty-title{ font-weight:600; color:var(--ink); margin-bottom:6px; }
.empty-msg{ font-size:13.5px; line-height:1.5; }
.empty-msg-sm{ font-size:13px; color:var(--ink-faint); padding:6px 0; }
.muted-text{ font-size:13px; color:var(--ink-dim); line-height:1.5; }

.dot{ width:10px; height:10px; border-radius:50%; display:inline-block; flex-shrink:0; }

.tabbar{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; display:flex; background:var(--surface); border-top:1px solid var(--border); padding:8px 4px calc(8px + env(safe-area-inset-bottom)); z-index:10; }
.tab-btn{ flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); padding:6px 2px; cursor:pointer; }
.tab-btn.active{ color:var(--accent); }
.tab-icon svg{ width:22px; height:22px; }
.tab-label{ font-size:10px; font-weight:600; }

.subject-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; }
.subject-row{ display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer; }
.subject-info{ flex:1; min-width:0; }
.subject-name{ font-weight:600; font-size:14.5px; }
.subject-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
.chev{ color:var(--ink-faint); font-size:18px; }
.subject-expanded{ padding:0 14px 14px; border-top:1px solid var(--border); }
.topics-list{ margin:10px 0; }
.topic-row{ display:flex; justify-content:space-between; align-items:center; padding:7px 0; font-size:13.5px; border-bottom:1px solid var(--border); }
.topic-row:last-child{ border-bottom:none; }
.icon-btn-sm{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:13px; padding:4px; }
.row-actions{ display:flex; gap:8px; margin-top:12px; }
.row-actions .btn{ flex:1; }

.timer-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px 20px; text-align:center; }
.timer-subject{ display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:var(--ink-dim); margin-bottom:18px; }
.timer-display{ font-family:var(--mono); font-size:44px; font-weight:600; letter-spacing:.02em; margin-bottom:8px; }
.timer-status{ font-size:12.5px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; margin-bottom:22px; }
.timer-actions{ display:flex; gap:10px; justify-content:center; }
.timer-actions .btn{ min-width:120px; }

.review-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; }
.review-info{ flex:1; min-width:0; }
.review-name{ font-size:14px; font-weight:600; }
.review-when{ font-size:12px; margin-top:2px; color:var(--ink-dim); }
.review-atrasada{ color:var(--warn); }
.review-hoje{ color:var(--accent); }

.wd-tabs{ display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px; }
.wd-tabs::-webkit-scrollbar{ display:none; }
.wd-tab{ flex:0 0 auto; padding:8px 13px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--ink-dim); font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }
.wd-tab.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.wd-tab.rest{ opacity:.6; border-style:dashed; }
.sched-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; }
.sched-info{ flex:1; min-width:0; }
.sched-name{ font-size:14px; font-weight:600; }
.sched-sub{ font-size:12px; color:var(--ink-dim); margin-top:2px; }
.sched-order{ display:flex; flex-direction:column; gap:2px; }
.sched-order button{ background:none; border:none; color:var(--ink-faint); cursor:pointer; font-size:11px; padding:2px 5px; line-height:1; }
.sched-order button:disabled{ opacity:.25; cursor:default; }
.sched-day-total{ font-size:12.5px; color:var(--ink-dim); margin:2px 0 12px; }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; cursor:pointer; margin:0; }
.toggle-row span{ font-size:13.5px; color:var(--ink); }
.toggle-row input{ width:auto; flex-shrink:0; }

.q-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:8px 0; border-bottom:1px solid var(--border); }
.q-row:last-child{ border-bottom:none; }
.perf-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.perf-name{ font-size:13px; width:96px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.perf-row .pbar{ flex:1; }
.perf-pct{ font-family:var(--mono); font-size:12px; width:38px; text-align:right; flex-shrink:0; }

.stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:6px; }
.stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 8px; text-align:center; }
.stat-value{ font-family:var(--mono); font-size:17px; font-weight:700; color:var(--accent); }
.stat-label{ font-size:10.5px; color:var(--ink-dim); margin-top:4px; }
.dist-row{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.dist-label{ width:104px; flex-shrink:0; font-size:12.5px; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dist-row .pbar{ flex:1; }
.dist-val{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); width:52px; text-align:right; flex-shrink:0; }
.evo-chart{ display:flex; align-items:flex-end; justify-content:space-between; height:100px; padding-top:10px; }
.evo-col{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; justify-content:flex-end; height:100%; }
.evo-bar{ width:14px; background:var(--accent); border-radius:4px; }
.evo-label{ font-size:10px; color:var(--ink-faint); text-transform:uppercase; }

.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-month-label{ font-weight:600; text-transform:capitalize; }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-faint); margin-bottom:4px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:14px; }
.cal-cell{ aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; background:var(--surface); border:1px solid transparent; }
.cal-cell.empty{ background:none; cursor:default; }
.cal-cell.today{ border-color:var(--accent); }
.cal-cell.selected{ background:var(--surface3); }
.cal-day-num{ font-size:12.5px; }
.cal-dots{ display:flex; gap:2px; height:6px; margin-top:2px; }
.cal-dot{ width:5px; height:5px; border-radius:50%; display:inline-block; }
.cal-dot.session{ background:var(--accent); }
.cal-dot.review{ background:var(--warn); }

.menu-grid{ display:flex; flex-direction:column; gap:8px; }
.menu-item{ display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:15px 16px; color:var(--ink); font-size:14.5px; font-weight:600; cursor:pointer; width:100%; text-align:left; }
.menu-item .chev{ color:var(--ink-faint); }

.goal-val{ font-family:var(--mono); font-size:12.5px; color:var(--ink-dim); margin:6px 0; }

.crash{ padding:40px 20px; text-align:center; }
.crash pre{ white-space:pre-wrap; color:var(--warn); font-size:12px; text-align:left; background:var(--surface); padding:12px; border-radius:8px; }

@media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js"></script>
<script>
(function(){
'use strict';

// ---- Firebase (sincronização) ----------------------------------------
// Cole aqui a configuração do seu projeto Firebase (Configurações do
// projeto > Geral > "Seus apps" > app Web). Enquanto ficar com o valor
// padrão abaixo, o app funciona normalmente só com armazenamento local.
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyB6Yh8dnAgsPJBJ7W7421qqs6tWOXOV4Bc",
  authDomain: "aprova-1e82f.firebaseapp.com",
  projectId: "aprova-1e82f",
  storageBucket: "aprova-1e82f.firebasestorage.app",
  messagingSenderId: "147112096652",
  appId: "1:147112096652:web:f07a3ae08a6287620fdca9"
};
var SYNCED_MARKER_KEY = 'ciclo_mais_synced_uid_v1';

var firebaseConfigured = !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== 'COLOQUE_AQUI');
var auth = null, db = null;
if (firebaseConfigured && typeof firebase !== 'undefined'){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    db = firebase.firestore();
  } catch(e){ console.error('Erro ao iniciar Firebase:', e); firebaseConfigured = false; auth=null; db=null; }
} else if (firebaseConfigured){
  firebaseConfigured = false; // scripts do Firebase não carregaram (offline/bloqueado)
}

var currentUser = null;
var syncBusy = false;
var syncErrorMsg = null;
var lastSyncAt = null;
var unsubscribeSnapshot = null;
var pushDebounceTimer = null;
var applyingRemoteUpdate = false;

var STORAGE_KEY = 'ciclo_mais_estado_v1';
var LADDER = [2,7,16,35];
var SUBJECT_COLORS = ['#E3A72B','#4FAE7C','#5B8DEF','#C1543C','#9B6BD6','#3FB6C9','#D68A3D','#8AA5D6'];
var STUDY_TYPES = ['Teoria','Questões','Revisão','Vídeo-aula','Leitura','Resumo'];
var WEEKDAY_LABELS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var WEEKDAY_SHORT = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

var hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage !== null);

function storageLoad(){
  if (hasClaudeStorage){
    return window.storage.get(STORAGE_KEY).then(function(res){
      return (res && res.value) ? JSON.parse(res.value) : null;
    }).catch(function(){ return null; });
  }
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  } catch(e){ return Promise.resolve(null); }
}

function storageSave(data){
  var json = JSON.stringify(data);
  if (hasClaudeStorage){
    return window.storage.set(STORAGE_KEY, json).catch(function(){
      try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
    });
  }
  try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){}
  return Promise.resolve();
}

function defaultState(){
  return {
    subjects: [], topics: [], sessions: [], questionLogs: [], reviews: [], schedule: [], cycle: [],
    goals: { daily: 120, weekly: 600, monthly: 2400 },
    activeTimer: null,
    cyclePointer: 0, cycleLaps: 0, restDays: [],
    ui: { tab:'hoje', subScreen:null, calMonth:null, expandedSubject:null, selectedCalDay:null,
          editingSubject:null, confirmDeleteSubject:null, confirmReset:false, preselectSubject:null,
          syncConflict:null, scheduleDay:null, confirmAutoSchedule:false,
          editingScheduleBlock:null, editingCycleItem:null, confirmDeleteSession:null }
  };
}

var state = defaultState();

function uid(){ return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addDaysStr(dateStr, n){
  var p = dateStr.split('-').map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  dt.setDate(dt.getDate()+n);
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}
function daysDiffStr(fromStr, toStr){
  var a = fromStr.split('-').map(Number), b = toStr.split('-').map(Number);
  var da = new Date(a[0],a[1]-1,a[2]).getTime(), db = new Date(b[0],b[1]-1,b[2]).getTime();
  return Math.round((db-da)/86400000);
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDur(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  var h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60);
  if (h>0) return h + 'h ' + m + 'min';
  if (m>0) return m + 'min';
  return totalSeconds + 's';
}
function fmtHMS(totalSeconds){
  totalSeconds = Math.max(0, Math.round(totalSeconds));
  var h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60), s = totalSeconds%60;
  return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function fmtDateBR(dateStr){ var p = dateStr.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtPct(x){ return Math.round(x*100) + '%'; }

function subjectById(id){ return state.subjects.find(function(s){ return s.id===id; }); }
function topicById(id){ return state.topics.find(function(t){ return t.id===id; }); }
function topicsForSubject(subjectId){ return state.topics.filter(function(t){ return t.subjectId===subjectId; }); }

function accuracyForSubject(subjectId){
  var logs = state.questionLogs.filter(function(q){ return q.subjectId===subjectId; });
  var total = logs.reduce(function(s,q){ return s+q.total; },0);
  var correct = logs.reduce(function(s,q){ return s+q.correct; },0);
  if (total===0) return null;
  return correct/total;
}

function lastActivityDateForSubject(subjectId){
  var last = null;
  state.sessions.filter(function(s){ return s.subjectId===subjectId; }).forEach(function(s){
    if (!last || s.date > last) last = s.date;
  });
  state.reviews.filter(function(r){ return r.subjectId
